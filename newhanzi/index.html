<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>识字星球 · newhanzi</title>
<link rel="stylesheet" href="zika.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body class="page-home">
<div class="app-shell">
  <aside class="side-nav" aria-label="主导航">
    <div class="side-brand">
      <strong>识字星球</strong>
      <span>护眼学习</span>
    </div>
    <nav class="side-tabs" id="sideTabs">
      <button class="mtab active" type="button" data-m="shizi"><span class="mtab-ico">🔤</span><span class="mtab-tx"><b>识字</b><i>3500 常用字</i></span></button>
      <button class="mtab" type="button" data-m="yuwen"><span class="mtab-ico">📝</span><span class="mtab-tx"><b>语法</b><i>句子 / 修辞 / 病句</i></span></button>
      <button class="mtab" type="button" data-m="logic"><span class="mtab-ico">🧠</span><span class="mtab-tx"><b>逻辑</b><i>推理 / 判断</i></span></button>
      <button class="mtab" type="button" data-m="bushou"><span class="mtab-ico">🧩</span><span class="mtab-tx"><b>部首</b><i>偏旁 / 字形演变</i></span></button>
      <button class="mtab" type="button" data-m="shici"><span class="mtab-ico">🌙</span><span class="mtab-tx"><b>古诗词</b><i>120 首 / 常识卡</i></span></button>
      <button class="mtab" type="button" data-m="lab"><span class="mtab-ico">🔬</span><span class="mtab-tx"><b>实验</b><i>动手 / 观察</i></span></button>
    </nav>
    <button class="side-cta" type="button" id="btnContinueSide">继续识字</button>
  </aside>

  <div class="app-main">
    <header class="home-top">
      <div class="home-brand">
        <h1>识字星球 <span class="badge">new</span></h1>
        <p class="home-sub">每天认识几个字</p>
      </div>
      <div class="home-top-actions">
        <button type="button" class="chip-soft" id="reviewChip">复习 0</button>
        <button type="button" class="btn-cta" id="btnContinue">继续识字</button>
      </div>
    </header>

    <section class="hero-card" aria-label="学习进度">
      <div class="hero-head">
        <span>今日学习</span>
        <span id="heroPct">完成度 0%</span>
      </div>
      <div class="hero-body">
        <div class="hero-main">
          <span class="hero-num" id="stTotal">0</span>
          <span class="hero-cap" id="learnedCount">已学 0 / 3500</span>
        </div>
        <div class="hero-stats">
          <div><b id="stToday">0</b><span>今日新字</span></div>
          <div><b id="stReview">0</b><span>待复习</span></div>
        </div>
      </div>
      <div class="pbar hero-pbar"><div id="pfill"></div></div>
      <button type="button" class="hero-cta" id="btnContinueHero">继续识字</button>
    </section>

    <div class="main-tabs module-grid" id="mainTabs">
      <button class="mtab active" type="button" data-m="shizi"><i></i>识字</button>
      <button class="mtab" type="button" data-m="yuwen"><i></i>语法</button>
      <button class="mtab" type="button" data-m="logic"><i></i>逻辑</button>
      <button class="mtab" type="button" data-m="lab"><i></i>实验</button>
      <button class="mtab" type="button" data-m="bushou"><i></i>部首</button>
      <button class="mtab" type="button" data-m="shici"><i></i>古诗词</button>
    </div>

    <div id="panel-shizi" class="panel-shizi">
      <div class="shizi-board">
        <div class="controls" id="controls">
          <div class="browse-head">
            <h2 class="browse-title">浏览字库</h2>
            <div class="tabs" id="tabs">
              <button class="tab" type="button" data-v="py">拼音</button>
              <button class="tab" type="button" data-v="bu">部首</button>
              <button class="tab" type="button" data-v="st">笔画</button>
            </div>
          </div>
          <div class="searchbox">
            <input id="q" type="text" placeholder="搜汉字 / 拼音，如：头 / tou" autocomplete="off">
          </div>
          <div class="tabrow">
            <span class="browse-hint">点右侧索引可快速跳转</span>
            <button class="chip-toggle" type="button" id="onlyNew">只看未学</button>
          </div>
        </div>
        <a href="quiz/index.html?tab=zika" style="display:block;text-align:center;margin:10px 14px;padding:13px;border-radius:12px;background:rgba(245,197,24,.12);border:1px solid #f5c518;color:#f5c518;font-size:16px;font-weight:bold;text-decoration:none;">🎮 互动练习：识字大闯关 →</a>
        <div class="list-area">
          <main class="listwrap">
            <div id="list"></div>
          </main>
          <nav id="rail" aria-label="快速索引"></nav>
        </div>
      </div>
    </div>

    <div id="panel-yuwen" class="panel-frame" style="display:none">
      <iframe src="yuwen.html" title="语法"></iframe>
    </div>

    <div id="panel-logic" class="panel-logic" style="display:none">
      <div id="logiclist"></div>
    </div>

    <div id="panel-lab" class="panel-frame" style="display:none">
      <iframe src="grammar_lab.html" title="实验"></iframe>
    </div>

    <div id="panel-bushou" class="panel-frame" style="display:none">
      <iframe src="bushou.html" title="部首"></iframe>
    </div>

    <div id="panel-shici" class="panel-frame" style="display:none">
      <iframe src="shici.html" title="古诗词"></iframe>
    </div>
  </div>
</div>

<script src="data/index.js"></script>
<script src="yuwen/data.js"></script>
<script src="index.js"></script>
<script>
/* 主 Tab 切换：识字 / 语法 / 逻辑 等 */
(function(){
  var tabs = document.querySelectorAll('.mtab');
  var panels = {shizi: document.getElementById('panel-shizi'),
                yuwen: document.getElementById('panel-yuwen'),
                logic: document.getElementById('panel-logic'),
                lab: document.getElementById('panel-lab'),
                bushou: document.getElementById('panel-bushou'),
                shici: document.getElementById('panel-shici')};
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function lessonHtml(it){
    var b='', step=0;
    function sh(t){step++;return '<div class="yw-step"><span class="yw-stepnum">'+step+'</span><span class="yw-steptitle">'+t+'</span></div>';}
    if(it['类比']) b += sh('打个比方')+'<div class="yw-analogy">'+it['类比']+'</div>';
    if(it['图示']) b += sh('看图说话')+'<div class="yw-diagram">'+it['图示']+'</div>';
    if(it['讲解']) b += sh('规则一句话')+'<p class="yw-exp">'+esc(it['讲解'])+'</p>';
    if(it['口诀']) b += '<div class="yw-koujue2">🗣️ 口诀：'+esc(it['口诀'])+'</div>';
    if(it['例子']&&it['例子'].length) b += '<div class="words">'+it['例子'].map(function(w){return '<span>'+esc(w)+'</span>';}).join('')+'</div>';
    if(it['易错']) b += sh('易错诊所')+'<div class="warn">⚠️ '+esc(it['易错'])+'</div>';
    if(it['小测']&&it['小测'].length){
      b += sh('动手小测')+'<div class="yw-quiz">'+it['小测'].map(function(q,qi){
        return '<div class="quiz-q"><div class="quiz-t">'+(qi+1)+'. '+esc(q.q)+'</div><div class="quiz-opts">'+
          q.options.map(function(op,oi){return '<button data-a="'+q.answer+'" data-oi="'+oi+'">'+esc(op)+'</button>';}).join('')+
          '</div><div class="quiz-fb"></div></div>';
      }).join('')+'</div>';
    }
    return '<div class="yw-item"><button class="yw-head"><span class="yw-name">'+esc(it.name||'')+'</span>'+
      (it['subtitle']?'<span class="yw-sub">'+esc(it['subtitle'])+'</span>':'')+
      '<span class="yw-arrow">▾</span></button><div class="yw-body">'+b+'</div></div>';
  }

  function activate(m){
    tabs.forEach(function(x){
      x.classList.toggle('active', x.getAttribute('data-m') === m);
    });
    for(var k in panels) panels[k].style.display = (k===m?'block':'none');
    if(m==='logic' && !panels.logic.dataset.done){
      var D = (window.NHZ_YUWEN||{}).logic;
      var el = document.getElementById('logiclist');
      if(D&&el){
        var h='<a href="quiz/index.html?tab=logic" style="display:block;text-align:center;margin:10px 14px;padding:13px;border-radius:12px;background:rgba(245,197,24,.12);border:1px solid #f5c518;color:#f5c518;font-size:16px;font-weight:bold;text-decoration:none;">🎮 互动练习：逻辑大闯关 →</a>';
        D.categories.forEach(function(c){
          h += '<div class="ghead">'+esc(c.name)+'<span class="gcount">'+c.items.length+'条</span></div>'+
            c.items.map(lessonHtml).join('');
        });
        el.innerHTML = h;
      }
      panels.logic.dataset.done='1';
    }
    window.scrollTo(0,0);
  }

  tabs.forEach(function(t){
    t.addEventListener('click', function(){ activate(t.getAttribute('data-m')); });
  });

  function goContinue(){
    var rows = document.querySelectorAll('#list .row');
    for(var i=0;i<rows.length;i++){
      if(!rows[i].querySelector('.done')){ location.href = rows[i].getAttribute('href'); return; }
    }
    var q = document.getElementById('q');
    if(q){ q.focus(); q.scrollIntoView({block:'center'}); }
  }
  ['btnContinue','btnContinueHero','btnContinueSide','reviewChip'].forEach(function(id){
    var el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('click', function(){
      if(id==='reviewChip'){
        var only = document.getElementById('onlyNew');
        activate('shizi');
        if(only && !only.classList.contains('on')) only.click();
        return;
      }
      activate('shizi');
      goContinue();
    });
  });

  document.addEventListener('click', function(e){
    var h = e.target.closest('.yw-head');
    if(h){ h.parentElement.classList.toggle('open'); return; }
    var qb = e.target.closest('.quiz-opts button');
    if(qb){
      var oi = parseInt(qb.getAttribute('data-oi')), ans = parseInt(qb.getAttribute('data-a'));
      var box = qb.closest('.quiz-q');
      var fb = box.querySelector('.quiz-fb');
      box.querySelectorAll('button').forEach(function(x){x.classList.remove('right','wrong');});
      if(oi===ans){ qb.classList.add('right'); fb.innerHTML='✅ 答对了！'; }
      else { qb.classList.add('wrong'); box.querySelectorAll('button')[ans].classList.add('right'); fb.innerHTML='❌ 再想想'; }
    }
  });
})();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
