<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>识字星球 · newhanzi</title>
<link rel="stylesheet" href="zika.css">
</head>
<body>
<header class="topbar">
  <h1>识字星球 <span class="badge">new</span></h1>
  <div class="progress-line">
    <span id="learnedCount">已学 0 / 3500</span>
    <div class="pbar"><div id="pfill"></div></div>
  </div>
</header>

<div class="today-panel">
  <div class="tstat"><span class="tnum" id="stTotal">0</span><span class="tlabel">总进度 <i>/ 3500</i></span></div>
  <div class="tstat"><span class="tnum" id="stToday">0</span><span class="tlabel">今日新字</span></div>
  <div class="tstat"><span class="tnum" id="stReview">0</span><span class="tlabel">待复习</span></div>
</div>

<div class="main-tabs" id="mainTabs">
  <button class="mtab active" data-m="shizi">📖 识字</button>
  <button class="mtab" data-m="yuwen">📚 语法</button>
  <button class="mtab" data-m="logic">🧠 逻辑</button>
  <button class="mtab" data-m="lab">🧪 实验</button>
  <button class="mtab" data-m="bushou">🧩 部首</button>
</div>

<div id="panel-shizi">

<div class="controls" id="controls">
  <div class="searchbox">
    <input id="q" type="text" placeholder="搜汉字 / 拼音，如：头 / tou" autocomplete="off">
  </div>
  <div class="tabrow">
    <div class="tabs" id="tabs">
      <button class="tab" data-v="py">按拼音</button>
      <button class="tab" data-v="bu">按部首</button>
      <button class="tab" data-v="st">按笔画</button>
    </div>
    <button class="chip-toggle" id="onlyNew">只看未学</button>
  </div>
</div>

<main class="listwrap">
  <div id="list"></div>
</main>
<nav id="rail" aria-label="快速索引"></nav>
</div><!-- /panel-shizi -->

<div id="panel-yuwen" style="display:none">
  <iframe src="proto-yuwen.html" style="width:100%;height:calc(100vh - 140px);border:none;display:block"></iframe>
</div>

<div id="panel-logic" style="display:none">
  <div id="logiclist"></div>
</div>

<div id="panel-lab" style="display:none">
  <iframe src="grammar_lab.html" style="width:100%;height:calc(100vh - 140px);border:none;display:block"></iframe>
</div>

<div id="panel-bushou" style="display:none">
  <iframe src="bushou.html" style="width:100%;height:calc(100vh - 140px);border:none;display:block"></iframe>
</div>

<script src="data/index.js"></script>
<script src="yuwen/data.js"></script>
<script src="index.js"></script>
<script>
/* 主 Tab 切换：识字 / 语法 / 逻辑 */
(function(){
  var tabs = document.querySelectorAll('#mainTabs .mtab');
  var panels = {shizi: document.getElementById('panel-shizi'),
                yuwen: document.getElementById('panel-yuwen'),
                logic: document.getElementById('panel-logic'),
                lab: document.getElementById('panel-lab'),
                bushou: document.getElementById('panel-bushou')};
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  /* 逻辑课渲染（复用六步格式） */
  function lessonHtml(it){
    var b='', step=0;
    function sh(t){step++;return '<div class="yw-step"><span class="yw-stepnum">'+step+'</span><span class="yw-steptitle">'+t+'</span></div>';}
    if(it['类比']) b += sh('打个比方')+'<div class="yw-analogy">'+it['类比']+'</div>';
    if(it['图示']) b += sh('看图说话')+'<div class="yw-diagram">'+it['图示']+'</div>';
    if(it['讲解']) b += sh('规则一句话')+'<p class="yw-exp">'+esc(it['讲解'])+'</p>';
    if(it['口诀']) b += '<div class="yw-koujue2">🗣️ 口诀：'+esc(it['口诀'])+'</div>';
    if(it['例子']&&it['例子'].length) b += '<div class="words">'+it['例子'].map(function(w){return '<span>'+esc(w)+'</span>';}).join('')+'</div>';
    if(it['易错']) b += sh('易错诊所')+'<div class="warn">⚠️ '+esc(it['易错'])+'</div>';
    if(it['小测']&&it['小测'].length){
      b += sh('动手小测')+'<div class="yw-quiz">'+it['小测'].map(function(q,qi){
        return '<div class="quiz-q"><div class="quiz-t">'+(qi+1)+'. '+esc(q.q)+'</div><div class="quiz-opts">'+
          q.options.map(function(op,oi){return '<button data-a="'+q.answer+'" data-oi="'+oi+'">'+esc(op)+'</button>';}).join('')+
          '</div><div class="quiz-fb"></div></div>';
      }).join('')+'</div>';
    }
    return '<div class="yw-item"><button class="yw-head"><span class="yw-name">'+esc(it.name||'')+'</span>'+
      (it['subtitle']?'<span class="yw-sub">'+esc(it['subtitle'])+'</span>':'')+
      '<span class="yw-arrow">▾</span></button><div class="yw-body">'+b+'</div></div>';
  }

  tabs.forEach(function(t){
    t.addEventListener('click', function(){
      tabs.forEach(function(x){x.classList.remove('active');});
      t.classList.add('active');
      var m = t.getAttribute('data-m');
      for(var k in panels) panels[k].style.display = (k===m?'block':'none');
      if(m==='logic' && !panels.logic.dataset.done){
        var D = (window.NHZ_YUWEN||{}).logic;
        var el = document.getElementById('logiclist');
        if(D&&el){
          var h='';
          D.categories.forEach(function(c){
            h += '<div class="ghead">'+esc(c.name)+'<span class="gcount">'+c.items.length+'条</span></div>'+
              c.items.map(lessonHtml).join('');
          });
          el.innerHTML = h;
        }
        panels.logic.dataset.done='1';
      }
      window.scrollTo(0,0);
    });
  });
  /* 手风琴 + 小测 */
  document.addEventListener('click', function(e){
    var h = e.target.closest('.yw-head');
    if(h){ h.parentElement.classList.toggle('open'); return; }
    var qb = e.target.closest('.quiz-opts button');
    if(qb){
      var oi = parseInt(qb.getAttribute('data-oi')), ans = parseInt(qb.getAttribute('data-a'));
      var box = qb.closest('.quiz-q');
      var fb = box.querySelector('.quiz-fb');
      box.querySelectorAll('button').forEach(function(x){x.classList.remove('right','wrong');});
      if(oi===ans){ qb.classList.add('right'); fb.innerHTML='✅ 答对了！'; }
      else { qb.classList.add('wrong'); box.querySelectorAll('button')[ans].classList.add('right'); fb.innerHTML='❌ 再想想'; }
    }
  });
})();
</script>
</body>
</html>
