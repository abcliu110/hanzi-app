<script>
/* 首页图解语法展示：从 yuwen 数据取 6 个富词类课 */
(function(){
  try {
    var g = (window.NHZ_YUWEN||{}).grammar;
    if(!g) return;
    var cilei = g.categories.filter(function(c){return c.id==='cilei';})[0];
    if(!cilei) return;
    var rich = cilei.items.filter(function(it){return it['subtitle'] && it['图示'];}).slice(0,6);
    var el = document.getElementById('gsScroll');
    if(!el || !rich.length) return;
    /* 取图示中的第一个符号 SVG */
    el.innerHTML = rich.map(function(it){
      var m = (it['图示']||'').match(/<svg[^>]*>.*?<\/svg>/);
      var sym = m ? m[0].replace('width="28" height="28"','width="40" height="40"') : '';
      var analogy = (it['类比']||'').replace(/<[^>]+>/g,'').substring(0,48)+'…';
      return '<a class="gs-card" href="yuwen.html">'+
        '<div class="gs-sym">'+sym+'</div>'+
        '<h4>'+it.name+'</h4>'+
        '<div class="gs-sub">'+(it['subtitle']||'')+'</div>'+
        '<div class="gs-ex">'+analogy+'</div></a>';
    }).join('');
  } catch(e){}
})();
</script>
