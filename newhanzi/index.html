<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>识字星球 · newhanzi</title>
<link rel="stylesheet" href="zika.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body class="page-home">
<!-- 首页：品牌 + 今日学习 + 7面板 -->
<div id="view-home" class="home-view">
  <div class="brand"><h1>识字星球</h1><p>护眼学习</p></div>
  <div class="today">
    <div><div class="t-num" id="stTotal">0</div><div class="t-label">今日学习</div></div>
    <div class="t-mid">
      <div class="t-row"><span id="heroPct">完成度 0%</span><span id="learnedCount">已学 0 / 3500</span></div>
      <div class="t-bar"><div class="t-fill" id="pfill"></div></div>
    </div>
    <div class="t-side"><b id="stToday">0</b> 新字 · <a href="fuxi.html" style="color:inherit;text-decoration:underline"><b id="stReview">0</b> 待复习</a></div>
  </div>
  <div class="today-task" id="todayTask" style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 14px 12px">
    <h2 style="margin:0 0 4px;font-size:17px">📋 今日任务</h2>
    <div id="ttRows"></div>
    <p id="ttNote" style="margin:8px 0 0;color:var(--ink);opacity:.8;font-size:14px"></p>
  </div>
  <div class="checkin-card" id="checkinCard" style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 14px 12px">
    <h2 style="margin:0 0 4px;font-size:17px">⭐ 打卡与星星</h2>
    <div id="ckRows"></div>
  </div>
  <div class="panels">
    <button class="panel" type="button" data-m="shizi">
      <svg viewBox="0 0 48 48" fill="none" stroke="#4a7a59" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="6" width="32" height="36" rx="4"/><path d="M18 18h12M24 14v16M18 26h12"/></svg>
      <b>识字</b><div class="prog"><i id="prog-shizi"></i></div><div class="prog-tx" id="progtx-shizi"></div>
    </button>
    <button class="panel" type="button" data-m="yuwen">
      <svg viewBox="0 0 48 48" fill="none" stroke="#4a7a59" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8l8 8L20 36l-10 2 2-10z"/><path d="M28 12l8 8"/></svg>
      <b>语法</b><div class="prog"><i style="width:12%"></i></div><div class="prog-tx">90 项</div>
    </button>
    <button class="panel" type="button" data-m="logic">
      <svg viewBox="0 0 48 48" fill="none" stroke="#4a7a59" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="16"/><path d="M24 14v10l7 5"/></svg>
      <b>逻辑</b><div class="prog"><i style="width:5%"></i></div><div class="prog-tx">211 题</div>
    </button>
    <button class="panel" type="button" data-m="bushou">
      <svg viewBox="0 0 48 48" fill="none" stroke="#4a7a59" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h6a4 4 0 014 4v4h4a4 4 0 014 4v6a4 4 0 01-4 4h-4v4a4 4 0 01-4 4h-6a4 4 0 01-4-4v-4h-4a4 4 0 01-4-4v-6a4 4 0 014-4h4v-4a4 4 0 014-4z"/></svg>
      <b>部首</b><div class="prog"><i style="width:8%"></i></div><div class="prog-tx">214 部首</div>
    </button>
    <button class="panel" type="button" data-m="shici">
      <svg viewBox="0 0 48 48" fill="none" stroke="#4a7a59" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M36 28A14 14 0 1120 8a11 11 0 0016 20z"/></svg>
      <b>古诗词</b><div class="prog"><i style="width:20%"></i></div><div class="prog-tx">120 首</div>
    </button>
    <button class="panel" type="button" data-m="guwen">
      <svg viewBox="0 0 48 48" fill="none" stroke="#4a7a59" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10c6-3 12-3 16 0 4-3 10-3 16 0v28c-6-3-12-3-16 0-4-3-10-3-16 0z"/><path d="M24 10v28"/></svg>
      <b>古文</b><div class="prog"><i style="width:10%"></i></div><div class="prog-tx">12 篇</div>
    </button>
    <button class="panel" type="button" data-m="lab">
      <svg viewBox="0 0 48 48" fill="none" stroke="#4a7a59" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6h8M22 6v12l-10 18a4 4 0 003.5 6h17a4 4 0 003.5-6L26 18V6"/><path d="M16 30h16"/></svg>
      <b>实验</b><div class="prog"><i style="width:3%"></i></div><div class="prog-tx">152 题</div>
    </button>
  </div>
</div>

<!-- 模块页：返回栏 + 内容 -->
<div id="view-module" class="module-view" style="display:none">
  <div class="topbar">
    <button class="back" type="button" id="btnBack">← 返回</button>
    <h1 id="modTitle">识字</h1><span class="sub" id="modSub"></span>
  </div>
  <div class="app-main">

    <div id="panel-shizi" class="panel-shizi">
      <div class="shizi-board">
        <div class="controls" id="controls">
          <div class="browse-head">
            <h2 class="browse-title">浏览字库</h2>
            <div class="tabs" id="tabs">
              <button class="tab" type="button" data-v="py">拼音</button>
              <button class="tab" type="button" data-v="bu">部首</button>
              <button class="tab" type="button" data-v="st">笔画</button>
            </div>
          </div>
          <div class="searchbox">
            <input id="q" type="text" placeholder="搜汉字 / 拼音，如：头 / tou" autocomplete="off">
          </div>
          <div class="tabrow">
            <span class="browse-hint">点右侧索引可快速跳转</span>
            <select id="gradeSel" title="按年级筛选" style="padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px">
              <option value="">全部年级</option>
              <option value="1上">一年级上册</option>
              <option value="1下">一年级下册</option>
              <option value="2上">二年级上册</option>
              <option value="2下">二年级下册</option>
              <option value="3上">三年级上册</option>
              <option value="3下">三年级下册</option>
              <option value="4上">四年级上册</option>
              <option value="4下">四年级下册</option>
              <option value="5上">五年级上册</option>
              <option value="5下">五年级下册</option>
              <option value="6上">六年级上册</option>
              <option value="6下">六年级下册</option>
              <option value="none">未分级</option>
            </select>
            <button class="chip-toggle" type="button" id="onlyNew">只看未学</button>
          </div>
        </div>
        <a href="quiz/index.html?tab=zika" style="display:block;text-align:center;margin:10px 14px;padding:13px;border-radius:12px;background:rgba(245,197,24,.12);border:1px solid #f5c518;color:#f5c518;font-size:16px;font-weight:bold;text-decoration:none;">🎮 互动练习：识字大闯关 →</a>
        <div class="list-area">
          <main class="listwrap">
            <div id="list"></div>
          </main>
          <nav id="rail" aria-label="快速索引"></nav>
        </div>
      </div>
    </div>

    <div id="panel-yuwen" class="panel-frame" style="display:none">
      <iframe src="yuwen.html" title="语法"></iframe>
    </div>

    <div id="panel-logic" class="panel-logic" style="display:none">
      <div id="logiclist"></div>
    </div>

    <div id="panel-lab" class="panel-frame" style="display:none">
      <iframe src="grammar_lab.html" title="实验"></iframe>
    </div>

    <div id="panel-bushou" class="panel-frame" style="display:none">
      <iframe src="bushou.html" title="部首"></iframe>
    </div>

    <div id="panel-shici" class="panel-frame" style="display:none">
      <iframe src="shici.html" title="古诗词"></iframe>
    </div>

    <div id="panel-guwen" class="panel-frame" style="display:none">
      <iframe src="guwen.html" title="古文"></iframe>
    </div>
  </div>
</div>

<script src="data/index.js"></script>
<script src="data/grade_map.js"></script>
<script src="yuwen/data.js"></script>
<script src="index.js"></script>
<script src="today-task.js"></script>
<script src="checkin.js"></script>
<script src="eye-care.js"></script>
<script src="install.js"></script>
<script>
/* 首页面板导航：主页 / 模块页切换 */
(function(){
  var viewHome = document.getElementById('view-home');
  var viewModule = document.getElementById('view-module');
  var modTitle = document.getElementById('modTitle');
  var modSub = document.getElementById('modSub');
  var panels = {shizi: document.getElementById('panel-shizi'),
                yuwen: document.getElementById('panel-yuwen'),
                logic: document.getElementById('panel-logic'),
                lab: document.getElementById('panel-lab'),
                bushou: document.getElementById('panel-bushou'),
                shici: document.getElementById('panel-shici'),
                guwen: document.getElementById('panel-guwen')};
  var titles = {shizi:['识字','3500 常用字'], yuwen:['语法','句子 / 修辞 / 病句'],
    logic:['逻辑','推理 / 判断'], lab:['实验','动手 / 观察'],
    bushou:['部首','偏旁 / 字形演变'], shici:['古诗词','120 首 / 常识卡'],
    guwen:['古文','文言 / 寓言 / 名篇']};
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function lessonHtml(it){
    var b='', step=0;
    function sh(t){step++;return '<div class="yw-step"><span class="yw-stepnum">'+step+'</span><span class="yw-steptitle">'+t+'</span></div>';}
    function escA(s){return esc(s).replace(/"/g,'&quot;');}
    if(it['类比']) b += sh('打个比方')+'<div class="yw-analogy">'+it['类比']+'</div>';
    if(it['图示']) b += sh('看图说话')+'<div class="yw-diagram">'+it['图示']+'</div>';
    if(it['讲解']) b += sh('规则一句话')+'<p class="yw-exp">'+esc(it['讲解'])+'</p>';
    if(it['口诀']) b += '<div class="yw-koujue2">🗣️ 口诀：'+esc(it['口诀'])+'</div>';
    if(it['例子']&&it['例子'].length) b += '<div class="words">'+it['例子'].map(function(w){return '<span>'+esc(w)+'</span>';}).join('')+'</div>';
    if(it['深讲']) b += sh('深讲一点')+'<p class="yw-exp">'+esc(it['深讲'])+'</p>';
    if(it['怎么认']&&it['怎么认'].length) b += sh('怎么认')+'<div class="yw-exp">'+it['怎么认'].map(function(s,si){return (si+1)+'、'+esc(s);}).join('<br>')+'</div>';
    if(it['辨析']) b += '<div class="warn">🔍 辨析：'+esc(it['辨析'])+'</div>';
    if(it['例句解析']&&it['例句解析'].length) b += sh('例句解析')+it['例句解析'].map(function(e){
      return '<p class="yw-exp">“'+esc(e.句)+'”<br>↳ '+esc(e.析)+'</p>';}).join('');
    if(it['易错']) b += sh('易错诊所')+'<div class="warn">⚠️ '+esc(it['易错'])+'</div>';
    if(it['练习']&&it['练习'].length){
      b += sh('动手练')+'<div class="yw-quiz">'+it['练习'].map(function(q,qi){
        return '<div class="quiz-q"><div class="quiz-t">'+(qi+1)+'. '+esc(q.q)+'</div><div class="quiz-opts">'+
          q.options.map(function(op,oi){return '<button data-a="'+q.answer+'" data-oi="'+oi+'" data-p="'+escA(q['解析']||'')+'">'+esc(op)+'</button>';}).join('')+
          '</div><div class="quiz-fb"></div></div>';
      }).join('')+'</div>';
    }
    if(it['小测']&&it['小测'].length){
      b += sh('动手小测')+'<div class="yw-quiz">'+it['小测'].map(function(q,qi){
        return '<div class="quiz-q"><div class="quiz-t">'+(qi+1)+'. '+esc(q.q)+'</div><div class="quiz-opts">'+
          q.options.map(function(op,oi){return '<button data-a="'+q.answer+'" data-oi="'+oi+'" data-p="'+escA(q['解析']||'')+'">'+esc(op)+'</button>';}).join('')+
          '</div><div class="quiz-fb"></div></div>';
      }).join('')+'</div>';
    }
    return '<div class="yw-item"><button class="yw-head"><span class="yw-name">'+esc(it.name||'')+'</span>'+
      (it['subtitle']?'<span class="yw-sub">'+esc(it['subtitle'])+'</span>':'')+
      '<span class="yw-arrow">▾</span></button><div class="yw-body">'+b+'</div></div>';
  }

  function openModule(m){
    if(!panels[m]) return;
    viewHome.style.display='none';
    viewModule.style.display='block';
    modTitle.textContent = titles[m][0];
    modSub.textContent = titles[m][1];
    for(var k in panels) panels[k].style.display = (k===m?'block':'none');
    /* iframe 模块自带左上角返回按钮，父页按钮隐藏，避免出现两个 */
    var btnBack = document.getElementById('btnBack');
    var isIframe = (m==='yuwen'||m==='lab'||m==='bushou'||m==='shici'||m==='guwen');
    if(btnBack) btnBack.style.display = isIframe ? 'none' : '';
    if(m==='logic' && !panels.logic.dataset.done){
      var D = (window.NHZ_YUWEN||{}).logic;
      var el = document.getElementById('logiclist');
      if(D&&el){
        var h='<a href="quiz/index.html?tab=logic" style="display:block;text-align:center;margin:10px 14px;padding:13px;border-radius:12px;background:rgba(245,197,24,.12);border:1px solid #f5c518;color:#f5c518;font-size:16px;font-weight:bold;text-decoration:none;">🎮 互动练习：逻辑大闯关 →</a>';
        D.categories.forEach(function(c){
          h += '<div class="ghead">'+esc(c.name)+'<span class="gcount">'+c.items.length+'条</span></div>'+
            c.items.map(lessonHtml).join('');
        });
        el.innerHTML = h;
      }
      panels.logic.dataset.done='1';
    }
    window.scrollTo(0,0);
  }

  document.querySelectorAll('#view-home .panel').forEach(function(p){
    p.addEventListener('click', function(){ openModule(p.getAttribute('data-m')); });
  });
  document.getElementById('btnBack').addEventListener('click', function(){
    viewModule.style.display='none';
    viewHome.style.display='flex';
    window.scrollTo(0,0);
  });

  document.addEventListener('click', function(e){
    var h = e.target.closest('.yw-head');
    if(h){ h.parentElement.classList.toggle('open'); return; }
    var qb = e.target.closest('.quiz-opts button');
    if(qb){
      var oi = parseInt(qb.getAttribute('data-oi')), ans = parseInt(qb.getAttribute('data-a'));
      var box = qb.closest('.quiz-q');
      var fb = box.querySelector('.quiz-fb');
      box.querySelectorAll('button').forEach(function(x){x.classList.remove('right','wrong');});
      var pj = qb.getAttribute('data-p') || '';
      if(oi===ans){ qb.classList.add('right'); fb.innerHTML='✅ 答对了！'+(pj?'<br>'+pj:''); }
      else { qb.classList.add('wrong'); box.querySelectorAll('button')[ans].classList.add('right'); fb.innerHTML='❌ 再想想'+(pj?'<br>'+pj:''); }
    }
  });
})();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
