<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>识字星球 · newhanzi</title>
<link rel="stylesheet" href="zika.css">
</head>
<body>
<header class="topbar">
  <h1>识字星球 <span class="badge">new</span></h1>
  <p class="sub">3500 常用字 · 12 维字卡</p>
</header>
<main class="wrap">
  <div class="searchbox">
    <input id="q" type="text" placeholder="输入一个汉字，如：头" maxlength="1" autocomplete="off">
    <button id="go">查字</button>
  </div>
  <div id="suggest" class="suggest"></div>
  <h2>随便看看</h2>
  <div id="random" class="chargrid"></div>
</main>
<script>
fetch('data/chars.json').then(r => r.json()).then(chars => {
  window.__chars = chars;
  const box = document.getElementById('random');
  const sample = ['头','妈','日','目','明','好','学','国','爱','龙'];
  sample.forEach(z => {
    const a = document.createElement('a');
    a.href = 'zika.html?zi=' + encodeURIComponent(z);
    a.className = 'charcell';
    a.textContent = z;
    box.appendChild(a);
  });
  const q = document.getElementById('q');
  const sug = document.getElementById('suggest');
  q.addEventListener('input', () => {
    const v = q.value.trim();
    sug.innerHTML = '';
    if (!v) return;
    const hits = chars.filter(c => c.includes(v)).slice(0, 24);
    hits.forEach(z => {
      const a = document.createElement('a');
      a.href = 'zika.html?zi=' + encodeURIComponent(z);
      a.className = 'charcell sm';
      a.textContent = z;
      sug.appendChild(a);
    });
  });
  document.getElementById('go').onclick = () => {
    const v = q.value.trim();
    if (v && chars.includes(v)) location.href = 'zika.html?zi=' + encodeURIComponent(v);
    else if (v) alert('字库里没有"' + v + '"，换一个字试试');
  };
  q.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('go').click(); });
});
</script>
</body>
</html>
