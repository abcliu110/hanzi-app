*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:17px;line-height:1.6;padding:12px;max-width:700px;margin:0 auto}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:10px}
.proto-head{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.proto-head h1{font-size:19px;margin-bottom:4px}
.proto-head .meta{font-size:13px;color:var(--muted)}
.proto-head .note{display:inline-block;margin-top:6px;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2px 10px;color:var(--accent-deep)}
.scorebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.scorebar .sc{color:var(--accent-deep)}
.q{font-size:19px;font-weight:700;margin:10px 0}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{display:block;width:100%;min-height:56px;font-size:18px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:center}
.opt:active{transform:scale(.98)}
.opt.correct{border-color:var(--green);background:var(--accent-soft)}
.opt.wrong{border-color:var(--red);opacity:.6}
.btnrow{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;min-height:56px;font-size:17px;font-weight:700;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--muted)}
.fb{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:15px;display:none}
.fb.show{display:block}
.fb.good{background:var(--accent-soft)}
.fb.bad{background:var(--card);border:1px solid var(--red)}
.slots{display:grid;gap:8px;margin:12px 0}
.slot{min-height:56px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted);padding:8px}
.slot.filled{border-style:solid;border-color:var(--accent);color:var(--ink)}
.slot .tag{font-size:12px;color:var(--muted);margin-right:8px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{min-height:56px;font-size:18px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip.used{opacity:.3;pointer-events:none}
.result{text-align:center;padding:20px}
.result .big{font-size:48px;margin-bottom:10px}
</style>
</head>
