<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诗眼 · 找最传神的字</title>
<style>
:root{
  --bg:#e4eedf; --card:#f2f6ee; --surface:#f8faf5;
  --ink:#2c3328; --muted:#6b7566;
  --accent:#4a7a59; --accent-deep:#3d5a40; --accent-soft:#d3e5d6;
  --line:#d5dfd0; --red:#b85a52; --green:#3f8e6b; --gold:#b98a2f;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1a211c; --card:#243028; --surface:#1e2620; --ink:#e6eee4; --muted:#9aa89b;
  --accent:#6fa87d; --accent-deep:#8fc49a; --accent-soft:#2a3a2e; --line:#33402f; }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; font-size:17px; line-height:1.6;}
.wrap{max-width:640px; margin:0 auto; padding:12px 14px 40px;}
.proto-head{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px;}
.proto-head h1{font-size:20px; margin:0 0 4px;}
.proto-head .meta{font-size:13px; color:var(--muted); margin:0 0 6px;}
.proto-head .note{display:inline-block; font-size:12px; background:var(--accent-soft); color:var(--accent-deep); border-radius:20px; padding:3px 12px; font-weight:bold;}
.hud{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:15px;}
.hud .pill{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:6px 14px;}
.hud .score{font-weight:bold; color:var(--accent-deep);}
.qcard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 14px; margin-bottom:12px;}
.qcard .qno{font-size:13px; color:var(--muted); margin-bottom:8px;}
.qcard .hint{font-size:15px; color:var(--muted); margin-bottom:12px;}
.chars{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:14px 0;}
.chars button{width:58px; height:58px; font-size:26px; border-radius:12px; border:2px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; font-family:inherit;}
.chars button:active{transform:scale(.94);}
.chars button.picked{border-color:var(--accent); background:var(--accent-soft);}
.chars button.right{border-color:var(--green); background:var(--green); color:#fff;}
.chars button.wrong{border-color:var(--red); background:var(--red); color:#fff;}
.chars button:disabled{cursor:default;}
.btnrow{display:flex; gap:10px; margin-top:6px;}
.btn{flex:1; min-height:56px; font-size:17px; border-radius:12px; border:2px solid var(--accent); cursor:pointer; font-family:inherit; font-weight:bold;}
.btn.primary{background:var(--accent); color:#fff;}
.btn.ghost{background:var(--card); color:var(--accent-deep);}
.feedback{border-radius:12px; padding:12px 14px; margin-top:12px; display:none; font-size:15px;}
.feedback.show{display:block;}
.feedback.good{background:var(--accent-soft); border:1px solid var(--accent);}
.feedback.bad{background:#f7e8e6; border:1px solid var(--red);}
@media (prefers-color-scheme: dark){ .feedback.bad{background:#3a2422;} }
.feedback .exp{margin-top:6px; color:var(--muted);}
.result{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px 16px; text-align:center; display:none;}
.result.show{display:block;}
.result .big{font-size:44px; margin-bottom:8px;}
.result h2{margin:0 0 8px;}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;"><a href="../../../shici.html" style="text-decoration:none;font-size:15px;color:var(--accent-deep);font-weight:bold;white-space:nowrap;">← 返回</a><h1 style="font-size:20px;margin:0;">👁️ 找诗眼</h1></div>
<div id="game">
    <div class="hud">
      <span class="pill" id="qno">第 1 题</span>
      <span class="pill score" id="score">得分 0</span>
    </div>
    <div class="qcard">
      <div class="hint">👆 点出这句诗里最传神的字（诗眼）：</div>
      <div class="chars" id="chars"></div>
      <div class="feedback" id="fb"></div>
      <div class="btnrow">
        <button class="btn ghost" id="btnNext">下一题 →</button>
      </div>
    </div>
  </div>
  <div class="result" id="result"></div>
</div>
<script>
var DATA = [{"line": "春风又绿江南岸", "pos": 3, "ans": "绿", "exp": "「绿」字把春风写活了，一个字让江南春色扑面而来。王安石为此字改了十几次。"}, {"line": "红杏枝头春意闹", "pos": 5, "ans": "意", "exp": "「闹」字以动写静，红杏的热闹反衬出春意的勃发，是化静为动的妙笔。"}, {"line": "僧敲月下门", "pos": 1, "ans": "敲", "exp": "「敲」字推敲而来。推是推门而入的冒失，敲是轻轻叩门的礼貌，一字见人物性格。"}, {"line": "云破月来花弄影", "pos": 5, "ans": "弄", "exp": "「弄」字写出花影被月光摆弄的姿态，拟人手法，一个字全句生动。"}, {"line": "大漠孤烟直", "pos": 4, "ans": "直", "exp": "「直」字写出烽烟在无风大漠中笔直升起的形态，苍劲有力。"}, {"line": "长河落日圆", "pos": 4, "ans": "圆", "exp": "「圆」字写出落日的浑圆形态，与「直」相对，一幅塞外奇观。"}, {"line": "明月松间照", "pos": 4, "ans": "照", "exp": "「照」字是动词，月光主动洒在松林间，画面有了光影流动。"}, {"line": "清泉石上流", "pos": 4, "ans": "流", "exp": "「流」字写出泉水在石上流淌的动态，与「照」对仗工整。"}, {"line": "感时花溅泪", "pos": 3, "ans": "溅", "exp": "「溅」字把花写成了泪水飞溅的样子，极言悲伤之深。"}, {"line": "恨别鸟惊心", "pos": 3, "ans": "惊", "exp": "「惊」字写出鸟叫让人心惊，恨别之情连鸟鸣都承受不住。"}, {"line": "随风潜入夜", "pos": 2, "ans": "潜", "exp": "「潜」字写出春雨悄无声息的样子，润物无声全靠这一个字。"}, {"line": "润物细无声", "pos": 2, "ans": "细", "exp": "「细」字写出雨丝的纤细，也写出滋润的温柔细腻。"}, {"line": "野火烧不尽", "pos": 2, "ans": "烧", "exp": "「烧」字写出野火的凶猛，与下句「吹又生」形成张力。"}, {"line": "春风吹又生", "pos": 2, "ans": "吹", "exp": "「吹」字写出春风的温柔而有力，吹醒了烧不尽的野草。"}, {"line": "白日依山尽", "pos": 4, "ans": "尽", "exp": "「尽」字写出太阳完全没入山后，天色将暮的苍茫。"}, {"line": "黄河入海流", "pos": 4, "ans": "流", "exp": "「流」字写出黄河奔流入海的磅礴气势，一往无前。"}, {"line": "孤帆远影碧空尽", "pos": 5, "ans": "空", "exp": "「尽」字写出孤帆渐渐消失在天际，送别的不舍全在这一个字。"}, {"line": "风老莺雏雨肥梅子", "pos": 1, "ans": "老", "exp": "「老」字写出莺长大、风变老的时光流逝，拟人手法。"}, {"line": "流光容易把人抛", "pos": 0, "ans": "流", "exp": "「抛」字写出时光把人狠狠甩下的无情，读来心惊。"}, {"line": "红了樱桃绿了芭蕉", "pos": 1, "ans": "了", "exp": "「红」「绿」两个颜色字，把时光流逝写成了看得见的颜色变化。"}, {"line": "人烟寒橘柚", "pos": 2, "ans": "寒", "exp": "「寒」字写出秋冬时节橘柚的清冷，人烟也带上了寒意。"}, {"line": "秋色老梧桐", "pos": 2, "ans": "老", "exp": "「老」字写出秋色让梧桐显出老态，时光催人老的感慨。"}, {"line": "鸟宿池边树", "pos": 1, "ans": "宿", "exp": "「宿」字写出鸟儿夜晚栖息的安静，与下句「敲」相呼应。"}, {"line": "春潮带雨晚来急", "pos": 5, "ans": "来", "exp": "「急」字写出春潮的湍急，也写出诗人归心似箭。"}, {"line": "野渡无人舟自横", "pos": 5, "ans": "自", "exp": "「横」字写出空船横在渡口的闲适，一个字全是悠然。"}, {"line": "蝉噪林逾静", "pos": 1, "ans": "噪", "exp": "「噪」字以动衬静，蝉越吵，林子显得越静，反衬手法。"}, {"line": "鸟鸣山更幽", "pos": 1, "ans": "鸣", "exp": "「鸣」字同样以动衬静，鸟鸣让山显得更幽深。"}, {"line": "月落乌啼霜满天", "pos": 5, "ans": "满", "exp": "「满」字写出霜华满天的寒冷，游子的孤寂全在这漫天白霜。"}, {"line": "姑苏城外寒山寺", "pos": 4, "ans": "寒", "exp": "「寒」字点出深秋的寒冷，也写出诗人心境的凄清。"}, {"line": "夜半钟声到客船", "pos": 5, "ans": "客", "exp": "「到」字写出钟声传到客船，打破了夜的寂静，也敲醒了乡愁。"}, {"line": "千山鸟飞绝", "pos": 4, "ans": "绝", "exp": "「绝」字写出鸟飞得无影无踪，天地的空旷寂寥。"}, {"line": "万径人踪灭", "pos": 4, "ans": "灭", "exp": "「灭」字写出人迹完全消失，与「绝」对仗，极言雪之大。"}, {"line": "孤舟蓑笠翁", "pos": 0, "ans": "孤", "exp": "「孤」字写出老渔翁的孤独，天地间只他一人。"}, {"line": "独钓寒江雪", "pos": 0, "ans": "独", "exp": "「独」字与「孤」呼应，一个人在寒江独钓，何等孤傲。"}, {"line": "桃花潭水深千尺", "pos": 4, "ans": "深", "exp": "「深」字写出潭水的深，也为下句「不及」做铺垫。"}, {"line": "不及汪伦送我情", "pos": 0, "ans": "不", "exp": "「不及」二字一转，千尺深潭也比不上朋友情深。"}, {"line": "白云深处有人家", "pos": 2, "ans": "深", "exp": "「深」字写出白云的深处，山路的幽远，人家的神秘。"}, {"line": "停车坐爱枫林晚", "pos": 3, "ans": "爱", "exp": "「爱」字直抒胸臆，因为爱才停车，一个字见真情。"}, {"line": "霜叶红于二月花", "pos": 2, "ans": "红", "exp": "「红」字写出霜叶的鲜红，胜过春花，视角独特。"}, {"line": "横看成岭侧成峰", "pos": 0, "ans": "横", "exp": "「横」「侧」两个字，点出看山角度不同景象各异。"}, {"line": "不识庐山真面目", "pos": 4, "ans": "真", "exp": "「真」字点出要看清真相，何等深刻的哲理。"}, {"line": "只缘身在此山中", "pos": 1, "ans": "缘", "exp": "「缘」字道出原因，因为身在山中所以看不清，一语点醒。"}, {"line": "会当凌绝顶", "pos": 2, "ans": "凌", "exp": "「凌」字写出登上绝顶的气势，少年的豪情壮志。"}, {"line": "一览众山小", "pos": 4, "ans": "小", "exp": "「小」字写出登高后众山变小的感觉，境界全开。"}, {"line": "国破山河在", "pos": 1, "ans": "破", "exp": "「破」字写出国都沦陷的惨烈，与「在」形成强烈对比。"}, {"line": "城春草木深", "pos": 4, "ans": "深", "exp": "「深」字写出草木的茂盛，反衬出城的荒凉。"}, {"line": "烽火连三月", "pos": 2, "ans": "连", "exp": "「连」字写出战火连绵不断，时间的漫长。"}, {"line": "家书抵万金", "pos": 2, "ans": "抵", "exp": "「抵」字写出一封家书价值万金，乱世中亲情的珍贵。"}, {"line": "白头搔更短", "pos": 2, "ans": "搔", "exp": "「搔」字写出诗人抓头的动作，愁到把头发都抓短了。"}, {"line": "浑欲不胜簪", "pos": 3, "ans": "胜", "exp": "「胜」字写出头发稀疏到簪不住，愁苦的具象化。"}, {"line": "好雨知时节", "pos": 2, "ans": "知", "exp": "「知」字把雨拟人化，好雨懂得在春天来临，善解人意。"}, {"line": "当春乃发生", "pos": 2, "ans": "乃", "exp": "「乃」字写出就在春天发生，恰到好处。"}, {"line": "两个黄鹂鸣翠柳", "pos": 4, "ans": "鸣", "exp": "「鸣」字写出黄鹂的叫声，清脆悦耳，春天的声音。"}, {"line": "一行白鹭上青天", "pos": 5, "ans": "青", "exp": "「上」字写出白鹭冲向青天的动态，画面有了升腾感。"}, {"line": "窗含西岭千秋雪", "pos": 1, "ans": "含", "exp": "「含」字把窗框写成了画框，含住了一幅雪景。"}, {"line": "门泊东吴万里船", "pos": 1, "ans": "泊", "exp": "「泊」字写出船停在门口，万里之遥近在眼前。"}, {"line": "千里莺啼绿映红", "pos": 2, "ans": "莺", "exp": "「啼」字写出黄莺的叫声，江南春天的热闹。"}, {"line": "水村山郭酒旗风", "pos": 5, "ans": "旗", "exp": "「风」字写出酒旗在风中飘动，江南水乡的气息。"}, {"line": "竹外桃花三两枝", "pos": 4, "ans": "三", "exp": "「三两」写出桃花初开的稀疏，春天的刚刚好。"}, {"line": "春江水暖鸭先知", "pos": 5, "ans": "先", "exp": "「先知」写出鸭子最先知道水暖，观察入微。"}, {"line": "蒌蒿满地芦芽短", "pos": 2, "ans": "满", "exp": "「满」字写出蒌蒿的茂盛，春天的生机。"}, {"line": "正是河豚欲上时", "pos": 4, "ans": "欲", "exp": "「欲」字写出河豚将要上游的动态，春天的讯息。"}, {"line": "接天莲叶无穷碧", "pos": 4, "ans": "无", "exp": "「无穷」写出莲叶的多，一望无际的绿。"}, {"line": "映日荷花别样红", "pos": 4, "ans": "别", "exp": "「别样」写出荷花的红与众不同，阳光下的娇艳。"}, {"line": "水光潋滟晴方好", "pos": 2, "ans": "潋", "exp": "「潋滟」写出水光的波动，晴天的西湖最美。"}, {"line": "山色空蒙雨亦奇", "pos": 4, "ans": "雨", "exp": "「奇」字写出雨中的山色同样奇妙，晴雨皆宜。"}, {"line": "欲把西湖比西子", "pos": 2, "ans": "西", "exp": "「比」字把西湖比作西施，千古名喻。"}, {"line": "淡妆浓抹总相宜", "pos": 4, "ans": "总", "exp": "「总」字写出无论哪种打扮都好看，西湖的百变之美。"}, {"line": "黑云翻墨未遮山", "pos": 2, "ans": "翻", "exp": "「翻」字写出黑云像打翻的墨汁，夏天的暴雨前兆。"}, {"line": "白雨跳珠乱入船", "pos": 2, "ans": "跳", "exp": "「跳」字写出雨点像珍珠一样跳进船里，活泼可爱。"}, {"line": "卷地风来忽吹散", "pos": 4, "ans": "忽", "exp": "「忽」字写出风来的突然，云散得也快。"}, {"line": "小楼一夜听春雨", "pos": 4, "ans": "听", "exp": "「听」字写出夜里听雨的闲适，春天的声音。"}, {"line": "深巷明朝卖杏花", "pos": 1, "ans": "巷", "exp": "「明朝」写出时间，明天一早就有杏花卖，春天的期待。"}, {"line": "矮纸斜行闲作草", "pos": 4, "ans": "闲", "exp": "「闲」字写出闲适的心境，随意写草书。"}, {"line": "晴窗细乳戏分茶", "pos": 4, "ans": "戏", "exp": "「戏」字写出分茶的游戏之乐，文人的雅趣。"}, {"line": "素衣莫起风尘叹", "pos": 1, "ans": "衣", "exp": "「莫」字是劝告，不要感叹风尘，一个字见豁达。"}, {"line": "犹及清明可到家", "pos": 0, "ans": "犹", "exp": "「犹」字写出还好、幸亏的庆幸，能赶回家过清明。"}, {"line": "一枝红杏出墙来", "pos": 4, "ans": "出", "exp": "「出」字写出红杏探出墙头，春色关不住的生机。"}, {"l var order = [], qi = 0, score = 0, locked = false;
function $(id){ return document.getElementById(id); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function start(){ order = shuffle(DATA.map(function(_,i){return i;})); qi=0; score=0; $("result").className="result"; $("game").style.display="block"; render(); }
function render(){
  if(qi >= order.length){ return end(); }
  locked = false;
  var q = DATA[order[qi]];
  $("qno").textContent = "第 " + (qi+1) + " / " + order.length + " 题";
  $("score").textContent = "得分 " + score;
  var box = $("chars"); box.innerHTML = "";
  for(var i=0;i<q.line.length;i++){
    (function(idx){
      var b = document.createElement("button");
      b.textContent = q.line[idx]; b.type="button";
      b.onclick = function(){ pick(idx, b); };
      box.appendChild(b);
    })(i);
  }
  var fb = $("fb"); fb.className="feedback"; fb.innerHTML="";
}
function pick(idx, btn){
  if(locked) return;
  locked = true;
  var q = DATA[order[qi]];
  var btns = $("chars").children;
  for(var i=0;i<btns.length;i++) btns[i].disabled = true;
  var good = (idx === q.pos);
  if(good){ score += 10; btn.className="right"; }
  else { btn.className="wrong"; btns[q.pos].className="right"; }
  $("score").textContent = "得分 " + score;
  var fb = $("fb");
  fb.className = "feedback show " + (good ? "good" : "bad");
  fb.innerHTML = (good ? "✅ 答对了！" : "❌ 再想想，答案是「"+q.ans+"」") +
    '<div class="exp">📖 ' + q.exp + "</div>";
}
$("btnNext").onclick = function(){ qi++; render(); window.scrollTo(0,0); };
function end(){
  $("game").style.display="none";
  var r = $("result"); r.className="result show";
  var pct = Math.round(score/(order.length*10)*100);
  var msg = pct>=90 ? "诗眼如炬！" : pct>=60 ? "很有感觉！" : "多读多品，继续加油！";
  r.innerHTML = '<div class="big">🏆</div><h2>'+msg+'</h2>' +

}
