<style>
:root{
  --bg:#e4eedf; --card:#f2f6ee; --surface:#f8faf5;

  --accent:#4a7a59; --accent-deep:#3d5a40; --accent-soft:#d3e5d6;
  --line:#d5dfd0; --red:#b85a52; --green:#3f8e6b;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1a211c; --card:#243028; --surface:#2b3a30;

    --accent-soft:#2e4433; --line:#3a4a3e; }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; padding:12px; background:var(--bg); color:var(--ink);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; font-size:17px; line-height:1.6;}
.wrap{max-width:640px; margin:0 auto;}
.proto-head{background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:12px 14px; margin-bottom:12px;}
.proto-head h1{font-size:19px; margin:0 0 4px;}
.proto-head .note{display:inline-block; font-size:13px; color:var(--accent-deep);
  background:var(--accent-soft); border-radius:8px; padding:2px 10px; margin-top:6px;}
.scorebar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.score{font-size:16px; font-weight:700; color:var(--accent-deep);}
.qcard{background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:18px 14px; margin-bottom:12px;}
.qline{font-size:24px; font-weight:700; text-align:center; margin:6px 0 4px;
  letter-spacing:2px; line-height:2;}
.qtip{text-align:center; color:var(--muted); font-size:14px; margin-bottom:12px;}
.opts{display:grid; gap:10px;}
.opt{min-height:56px; font-size:19px; border:2px solid var(--line); border-radius:12px;
  background:var(--surface); color:var(--ink); cursor:pointer; padding:10px 12px;
  letter-spacing:1px;}
.opt:active{transform:scale(.98);}
.opt.right{border-color:var(--green); background:var(--accent-soft);}
.opt.wrong{border-color:var(--red);}
.btnrow{display:flex; gap:10px; margin-top:12px;}
.btn{flex:1; min-height:56px; font-size:18px; font-weight:700; border-radius:12px;
  border:2px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer;}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.feedback{margin-top:12px; padding:12px; border-radius:12px; font-size:16px; display:none;}
.feedback.show{display:block;}
.feedback.good{background:var(--accent-soft);}
.feedback.bad{background:var(--card); border:1px solid var(--red);}
.endcard{background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:24px 16px; text-align:center; display:none;}
.endcard.show{display:block;}
.endcard h2{margin:0 0 10px;}
</style>

var qi = 0, score = 0, answered = false;
var order = [];

function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function start(){

function render(){

function renderQ(q){

  var box = $("opts"); box.innerHTML = "";

}
function poemLinkFor(q){ var ta = POEM_LINK.splitTip(q.tip); return POEM_LINK.linkHtml(q.line, ta.t, ta.a); }
function showFb(good, title, sub, linkHtml){
