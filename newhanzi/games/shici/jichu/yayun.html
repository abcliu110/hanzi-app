var order = shuffle(POEMS.slice()), qi = 0, score = 0;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function $(id){return document.getElementById(id);}
function nextQ(){
  if(qi >= order.length){ endGame(); return; }
  var p = order[qi];
  var need = {};
  p.yj.forEach(function(c){ need[c] = (need[c]||0)+1; });
  var got = {};
  function totalGot(){ var s=0; for(var k in got) s+=got[k]; return s; }
  var h = '<div class="card"><div class="q">《'+p.t+'》 <span style="font-size:15px;color:var(--muted)">'+p.a+'</span></div>'
    + '<div class="hint">点出韵脚字（偶数句的句尾字，共 '+p.yj.length+' 个，已找到 <b id="fd">0</b> 个）</div>'
    + '<div class="poem">';
  p.lines.forEach(function(ln){
    h += '<div class="ln">';
    for(var ci=0; ci<ln.length; ci++){
      h += '<button class="zibtn" data-ch="'+ln[ci]+'">'+ln[ci]+'</button>';
    }
    h += '</div>';
  });
  h += '</div><div class="fb" id="fb"></div></div>';
  $('stage').innerHTML = h;
  $('qtag').textContent = '第 ' + (qi+1) + ' / ' + order.length + ' 题';
  $('stage').querySelectorAll('.zibtn').forEach(function(b){
    b.onclick = function(){
      if(b.classList.contains('hit')) return;
      var ch = b.getAttribute('data-ch');
      if((need[ch]||0) > (got[ch]||0)){
        b.classList.add('hit');
        got[ch] = (got[ch]||0)+1;
        $('fd').textContent = totalGot();
        if(totalGot() >= p.yj.length){
          score += 10; $('score').textContent = score;
          var fb=$('fb'); fb.className='fb ok';
          fb.textContent='✓ 找全了！韵脚：'+p.yj.join('、')+'（+10分）';
          setTimeout(function(){ qi++; nextQ(); }, 1500);
        }
      } else {
        b.style.borderColor='var(--red)';
        setTimeout(function(){ b.style.borderColor=''; }, 400);
      }
    };
  });
}
function endGame(){
  $('stage').style.display='none'; $('btnSkip').style.display='none';
  $('end').style.display='block';
  $('finalScore').textContent = score + ' 分';
  $('finalMsg').textContent = '共 '+order.length+' 题，'+(score>=order.length*8?'押韵小能手！':score>=order.length*5?'不错，继续加油！':'记住：偶数句的句尾字就是韵脚。');
}
$('btnSkip').onclick = function(){ if($('stage').style.display==='none')return; qi++; nextQ(); };
$('btnAgain').onclick = function(){ location.reload(); };
nextQ();

</script></body></html>
