.feedback.good{background:var(--accent-soft);}
.feedback.bad{background:var(--card); border:1px solid var(--red);}
.endcard{background:var(--card); border:1px solid var(--line); border-radius:14px;

.endcard.show{display:block;}
.endcard h2{margin:0 0 10px;}

var qi = 0, score = 0, answered = false;

function $(id){ return document.getElementById(id); }

function start(){
