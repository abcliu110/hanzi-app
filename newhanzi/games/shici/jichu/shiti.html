*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; font-size:17px; line-height:1.6;}
.wrap{max-width:640px; margin:0 auto; padding:12px 14px 40px;}
.proto-head{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px;}
.proto-head h1{font-size:20px; margin:0 0 4px;}
.proto-head .meta{font-size:13px; color:var(--muted); margin:0 0 6px;}

.hud{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:15px;}
.hud .pill{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:6px 14px;}
.hud .score{font-weight:bold; color:var(--accent-deep);}
.qcard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 14px; margin-bottom:12px; text-align:center;}
.qcard .ptitle{font-size:24px; font-weight:bold; margin:8px 0 4px;}
.qcard .pauthor{font-size:14px; color:var(--muted); margin-bottom:14px;}
.qcard .hint{font-size:15px; color:var(--muted); margin-bottom:6px;}
.opts{display:flex; flex-direction:column; gap:10px; margin-top:10px;}
.opts button{min-height:56px; font-size:18px; border-radius:12px; border:2px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; font-family:inherit;}
.opts button:active{transform:scale(.98);}
.opts button.right{border-color:var(--green); background:var(--green); color:#fff;}
.opts button.wrong{border-color:var(--red); background:var(--red); color:#fff;}
.opts button:disabled{cursor:default; opacity:.85;}
.btnrow{display:flex; gap:10px; margin-top:12px;}
.btn{flex:1; min-height:56px; font-size:17px; border-radius:12px; border:2px solid var(--accent); cursor:pointer; font-family:inherit; font-weight:bold;}
.btn.primary{background:var(--accent); color:#fff;}
.btn.ghost{background:var(--card); color:var(--accent-deep);}
.feedback{border-radius:12px; padding:12px 14px; margin-top:12px; display:none; font-size:15px; text-align:left;}
.feedback.show{display:block;}
.feedback.good{background:var(--accent-soft); border:1px solid var(--accent);}
.feedback.bad{background:#f7e8e6; border:1px solid var(--red);}
@media (prefers-color-scheme: dark){ .feedback.bad{background:#3a2422;} }
.feedback .exp{margin-top:6px; color:var(--muted);}
.result{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px 16px; text-align:center; display:none;}
.result.show{display:block;}
.result .big{font-size:44px; margin-bottom:8px;}
</style>

var THEMES = ["送别","思乡","写景","咏物","怀古","爱国","田园","边塞","爱情","哲理","饮酒","羁旅"];
var order = [], qi = 0, score = 0, locked = false, curOpts = [];
function $(id){ return document.getElementById(id); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function start(){ order = shuffle(DATA.map(function(_,i){return i;})); qi=0; score=0; $("result").className="result"; $("game").style.display="block"; render(); }
function render(){
  if(qi >= order.length){ return end(); }
  locked = false;
  var q = DATA[order[qi]];
  $("qno").textContent = "第 " + (qi+1) + " / " + order.length + " 题";
  $("score").textContent = "得分 " + score;
  $("ptitle").textContent = "《" + q.t + "》";
  $("pauthor").textContent = q.a;
  var others = shuffle(THEMES.filter(function(t){return t!==q.theme;})).slice(0,3);
  curOpts = shuffle([q.theme].concat(others));
  var box = $("opts"); box.innerHTML = "";
  curOpts.forEach(function(t){
    var b = document.createElement("button");
    b.textContent = t; b.type = "button";
    b.onclick = function(){ pick(t, b); };
    box.appendChild(b);
  });
  var fb = $("fb"); fb.className="feedback"; fb.innerHTML="";
}
function pick(t, btn){
  if(locked) return;
  locked = true;
  var q = DATA[order[qi]];
  var btns = $("opts").children;
  for(var i=0;i<btns.length;i++){ btns[i].disabled=true; if(curOpts[i]===q.theme) btns[i].className="right"; }
  var good = (t === q.theme);
  if(good){ score += 10; } else { btn.className="wrong"; }
  $("score").textContent = "得分 " + score;
  var fb = $("fb");
  fb.className = "feedback show " + (good ? "good" : "bad");
  fb.innerHTML = (good ? "✅ 答对了！「"+q.t+"」是"+q.theme+"诗。" : "❌ 答案是「"+q.theme+"」。") +
    (q.exp ? '<div class="exp">📖 ' + q.exp + "</div>" : "");
}
$("btnNext").onclick = function(){ qi++; render(); window.scrollTo(0,0); };
function end(){
  $("game").style.display="none";
  var r = $("result"); r.className="result show";
  var pct = Math.round(score/(order.length*10)*100);
  var msg = pct>=90 ? "火眼金睛！" : pct>=60 ? "题感不错！" : "多看诗题，继续加油！";
  r.innerHTML = '<div class="big">🏆</div><h2>'+msg+'</h2>' +
    "<p>得分 " + score + " / " + (order.length*10) + "</p>" +
    '<div class="btnrow"><button class="btn primary" onclick="start()">🔄 再来一轮</button></div>';
}
start();
