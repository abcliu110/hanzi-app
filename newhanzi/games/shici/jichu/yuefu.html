<style>

*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:17px;line-height:1.6;padding:12px;max-width:640px;margin:0 auto;min-height:100vh;}

.round{font-size:15px;color:var(--muted);}
.score{font-size:16px;font-weight:700;color:var(--accent-deep);}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;}
.qtext{font-size:19px;font-weight:bold;margin-bottom:14px;line-height:1.5;}
.opts{display:grid;grid-template-columns:1fr;gap:10px;}
.opt{min-height:56px;font-size:17px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;padding:12px 14px;}
.opt:active{transform:scale(.98);}
.opt.right{border-color:var(--green);background:var(--accent-soft);}
.opt.wrong{border-color:var(--red);opacity:.7;}
.feedback{border-radius:12px;padding:12px 14px;margin-bottom:12px;display:none;font-size:16px;}
.feedback.show{display:block;}
.feedback.good{background:var(--accent-soft);border:1px solid var(--accent);}
.feedback.bad{background:var(--card);border:1px solid var(--red);}
.feedback .exp{margin-top:6px;font-size:15px;color:var(--muted);}
.btnrow{display:flex;gap:10px;margin-bottom:12px;}
.btn{flex:1;min-height:56px;font-size:17px;font-weight:bold;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.result{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;}
.result h2{font-size:24px;margin-bottom:10px;}
.result .big{font-size:48px;margin:10px 0;}
.hidden{display:none!important;}
</style>
