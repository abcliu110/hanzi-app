var qi = 0, score = 0, answered = false;
function $(id){return document.getElementById(id);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
QS = shuffle(QS.slice());
function render(){
  answered = false;
  var q = QS[qi];
  $("round").textContent = "第 " + (qi+1) + " / " + QS.length + " 题";
  $("score").textContent = "得分 " + score;
  $("qtitle").textContent = q.q || "这首诗是什么体裁？";

  $("fb").className = "feedback";
  $("opt1").disabled = $("opt2").disabled = false;
}
function answer(pick){
  if(answered) return; answered = true;
  var q = QS[qi];
  var good = (pick === q.ans);
  if(good) score += 10;
  var fb = $("fb");
  fb.className = "feedback show " + (good ? "good" : "bad");
  fb.innerHTML = "<div>" + (good ? "✅ 答对了！" : "❌ 答错了，正确答案是「"+q.ans+"」") + "</div>" +

  $("opt1").disabled = $("opt2").disabled = true;
  setTimeout(next, 1600);
}

}
