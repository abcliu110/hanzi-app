<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复习 · 识字星球</title>
<link rel="stylesheet" href="zika.css">
<link rel="manifest" href="manifest.webmanifest">
<style>
.fx-section{margin:16px 0}
.fx-section h2{margin:0 0 10px;font-size:20px}
.fx-empty{color:var(--muted);font-size:15px}
.fx-card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;background:var(--surface)}
.fx-card p{margin:8px 0}
.fx-src{font-size:13px;color:var(--muted)}
.fx-q{font-size:17px;font-weight:bold}
.fx-ans{border-top:1px dashed var(--line);margin-top:10px;padding-top:6px}
.fx-opts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.fx-opt{border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:14px;background:var(--card)}
.fx-opt.fx-right{border-color:var(--accent);color:var(--accent-deep);font-weight:bold}
.fx-btn{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:6px 16px;font-size:14px;cursor:pointer;margin-right:8px}
.fx-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fx-note{color:var(--accent-deep);font-size:15px;min-height:22px}
</style>
</head>
<body class="page-sub">
<header class="topbar nav">
  <a href="index.html" target="_top" class="back">← 返回</a>
  <span id="navtitle">复习</span>
</header>
<main class="wrap" id="app">
  <div class="loading">复习加载中…</div>
</main>
<script src="fuxi.js"></script>
</body>
</html>
