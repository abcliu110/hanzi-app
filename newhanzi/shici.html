var KNOW_MODS = [['ticai','📝','诗的体裁'],['gelv','🎵','格律'],['gelv2','🧭','格律进阶'],['shoufa','✨','作诗手法'],['cipai','🎼','词牌名'],['shishi','🏛️','诗歌史'],['liupai','⛰️','流派与大家'],['diangu','📚','典故出处'],['dufa','🔍','读诗方法'],['yingyong','🛠️','诗词应用'],['wenhua','🌏','诗词与历史文化'],['donghua','🎬','动画·把诗看活'],['jilu','🎥','纪录片·实拍'],['jichu','🌱','诗歌基础'],['yixiang','🌙','意象'],['cixi','🎶','词'],['shangxifa','🔬','赏析方法'],['gelv3','📐','格律深化'],['chuangzuo','✍️','创作入门']];

/* 内容分型：8型（CONTENT_PATTERNS.md v2.0），按模块m+标题细分 */
function knowType(m, t){
  var title = t || '';
  /* 程序型：方法/步骤类 */
  if (/shangxifa|chuangzuo|dufa|yingyong/.test(m)) return '程序';
  /* 故事型：历史/典故叙事 */
  if (/diangu|shishi/.test(m)) return '故事';
  /* 清单型：速查参考 */
  if (/ticai|wenhua|liupai|jilu/.test(m)) return '清单';
  /* 模式型：词牌格式/格律模式 */
  if (/cipai/.test(m)) return '模式';
  if (m === 'cixi' && /浣溪沙|菩萨蛮|如梦令|水调歌头|虞美人|双调|单调|^\S+：\d+/.test(title)) return '模式';
  /* 辨析型：易混对比 */
  if (m === 'shoufa' && /与|结合|比兴/.test(title)) return '辨析';
  if (m === 'cixi' && /豪放|婉约|派|令|慢词/.test(title)) return '辨析';
  /* 动画模块保持原样 */
  if (/donghua/.test(m)) return '动画';
  /* 默认规律型 */
  return '规律';
}

      a.addEventListener('click', function(){ openPoem(parseInt(a.getAttribute('data-o'),10)); });

    el.addEventListener('click', function(){ document.getElementById('ziinput').value = el.getAttribute('data-zi'); run(el.getAttribute('data-zi')); });

function openPoem(order){
  var p = poemByOrder(order);
  if(!p){ vHome(); return; }
  setTitle(p.title);
  var h = '<div class="sc-detail-head"><h2>'+esc(p.title)+'</h2><div class="sc-detail-meta">'+esc(p.author)+' · '+esc(p.dynasty||'')+' · '+esc(p.ticai||'')+'</div></div>';
  /* 逐句锚点：每句可点，点击滚动到对应讲解 */
  h += '<div class="sc-lines">'+p.lines.map(function(l,i){return '<p class="sc-line" data-li="'+i+'">'+esc(l)+'</p>';}).join('')+'</div>';
  /* 名篇精讲赏析 */
  try{
    var sx = (window.NHZ_SHANGXI||[]).filter(function(x){return x.t===p.title && x.a===p.author;})[0];
    if(sx){
      h += '<div class="sc-card" style="margin-top:12px"><h3>📜 背景</h3><p>'+esc(sx.bg)+'</p></div>';
      h += '<div class="sc-card" style="margin-top:8px"><h3>🔍 逐句讲</h3>'+sx.zj.map(function(z,zi){return '<p class="sc-zj" id="sczj-'+zi+'">'+esc(z)+'</p>';}).join('')+'</div>';
      h += '<div class="sc-card" style="margin-top:8px"><h3>✨ 艺术特色</h3><p>'+esc(sx.ys)+'</p></div>';
    }
  }catch(e){}
  h += '<button class="sc-backbtn" id="scback">← 返回</button>';
  detEl.innerHTML = h; showDetail();
  document.getElementById('scback').addEventListener('click', function(){ showList(); });
  /* 逐句锚点点击事件 */
  try{
    var lineEls = detEl.querySelectorAll('.sc-line');
    for(var li=0; li<lineEls.length; li++){
      (function(el, idx){
        el.style.cursor = 'pointer';
        el.addEventListener('click', function(){
          var target = document.getElementById('sczj-'+idx);
          if(target){
            target.scrollIntoView({behavior:'smooth', block:'center'});
            target.style.background = '#fff8e1';
            setTimeout(function(){ target.style.background = ''; }, 2000);
          }
        });
      })(lineEls[li], li);
    }
  }catch(e){}
  try{ history.replaceState(null,'','#poem-'+order); }catch(e){}
}

function go(v){
  try{ history.replaceState(null,'',' '); }catch(e){}
  if(v==='home') vHome();
  else if(v==='know') vKnow();
  else if(v==='dyn') vDyn();
  else if(v==='poets') vPoets();
  else if(v==='famous') vFamous();
  else if(v==='imagery') vImagery();
  else if(v==='zilian') vZilian();
  else if(v==='poems') vPoems();
  else vHome();
}

/* 深链：shici.html#poem-12 / shici.html#zilian-月 */
(function init(){
  var hash = location.hash || '';
  var m = hash.match(/#poem-(\d+)/);
  var mz = hash.match(/#zilian-(.+)/);
  if(m){ openPoem(parseInt(m[1],10)); }
  else if(mz){ vZilian(decodeURIComponent(mz[1])); }
  else vHome();
})();
})();
</script>
