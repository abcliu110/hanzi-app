<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古诗词 · newhanzi</title>
<link rel="stylesheet" href="zika.css">
<link rel="manifest" href="manifest.webmanifest">
<style>
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px}
.sc-card{background:var(--xzq-card,#1c1c1e);border:1px solid var(--xzq-border,#e5e0d5);border-radius:14px;padding:16px 14px;cursor:pointer}
.sc-card h3{margin:0 0 8px;font-size:17px;color:#f5c518}
.sc-card p{margin:0;font-size:13px;line-height:1.7;color:var(--xzq-muted,#8a8578)}
.sc-card:active{transform:scale(.98)}
.sc-poem{padding:14px 16px;border-bottom:1px solid var(--xzq-border,#e5e0d5);cursor:pointer}
.sc-poem:active{background:var(--xzq-surface-muted,#f7f3ea)}
.sc-ptitle{font-size:18px;font-weight:700}
.sc-pmeta{font-size:13px;color:var(--xzq-muted,#8a8578);margin-top:4px}
.sc-badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--xzq-surface-muted,#f7f3ea);border:1px solid var(--xzq-border,#e5e0d5);margin-right:6px}
.sc-lines{font-size:20px;line-height:2;text-align:center;padding:18px 8px}
.sc-lines p{margin:0}
.sc-poet{padding:14px 16px;border-bottom:1px solid var(--xzq-border,#e5e0d5);cursor:pointer}
.sc-poet .sc-pname{font-size:17px;font-weight:700}
.sc-poet .sc-pbio{font-size:14px;color:var(--xzq-muted,#8a8578);margin-top:6px;line-height:1.7}
.sc-know{margin:12px 16px;padding:14px;border:1px solid var(--xzq-border,#e5e0d5);border-radius:12px;background:var(--xzq-surface,#fff)}
.sc-know h3{margin:0 0 8px;font-size:16px}
.sc-know p{margin:0;font-size:14px;line-height:1.8;color:var(--xzq-text,#333)}
.sc-story{margin:12px 16px;padding:14px;border-radius:12px;background:var(--xzq-surface-muted,#f7f3ea);border:1px dashed var(--xzq-border,#e5e0d5)}
.sc-story h4{margin:0 0 8px;font-size:15px}
.sc-story p{margin:0;font-size:14px;line-height:1.8}
.sc-dyn{margin:0 16px;padding:14px 0 14px 18px;border-left:3px solid #f5c518;position:relative}
.sc-dyn::before{content:'';position:absolute;left:-8px;top:18px;width:13px;height:13px;border-radius:50%;background:#f5c518}
.sc-dyn h3{margin:0;font-size:18px}
.sc-dyn .sc-dyntime{font-size:13px;color:var(--xzq-muted,#8a8578);margin:4px 0 8px}
.sc-dyn p{margin:6px 0;font-size:14px;line-height:1.8}
.sc-dyn .sc-why{color:var(--xzq-text,#333)}
.sc-famous{margin:12px 16px;padding:14px;border:1px solid var(--xzq-border,#e5e0d5);border-radius:12px}
.sc-famous .sc-fline{font-size:17px;font-weight:700;line-height:1.7}
.sc-famous .sc-fbai{font-size:14px;color:var(--xzq-muted,#8a8578);margin-top:8px;line-height:1.7}
.sc-famous .sc-fstory{font-size:14px;margin-top:8px;line-height:1.8}
.sc-famous .sc-flink{margin-top:8px;font-size:13px}
.sc-hitline{font-size:16px;line-height:1.9;color:var(--xzq-text,#e8e4d8)}
.sc-hitline mark{background:#f5c518;color:#1a1a1a;padding:0 2px;border-radius:3px}
.sc-imgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px 16px}
.sc-im{aspect-ratio:1;border:1px solid var(--xzq-border,#e5e0d5);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--xzq-surface,#fff)}
.sc-im .sc-imzi{font-size:30px;font-weight:700}
.sc-im .sc-immean{font-size:12px;color:var(--xzq-muted,#8a8578);margin-top:4px}
.sc-detail-head{text-align:center;padding:20px 16px 6px}
.sc-detail-head h2{margin:0;font-size:26px}
.sc-detail-meta{margin-top:8px;font-size:14px;color:var(--xzq-muted,#8a8578)}
.sc-backbtn{display:block;margin:6px 16px 0;padding:10px;border-radius:10px;border:1px solid var(--xzq-border,#e5e0d5);background:var(--xzq-surface,#fff);font-size:15px;cursor:pointer;width:calc(100% - 32px)}
.sc-src{font-size:12px;color:var(--xzq-muted,#8a8578);text-align:center;padding:16px}
.sc-chips{padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px}
.sc-chip{padding:6px 14px;border-radius:16px;border:1px solid var(--xzq-border,#e5e0d5);background:var(--xzq-surface,#fff);font-size:14px;cursor:pointer}
.sc-chip.active{background:#f5c518;border-color:#f5c518;color:#000}
.sc-zrow{display:flex;gap:8px;padding:14px 16px}
.sc-zrow input{flex:1;font-size:18px;padding:10px 12px;border-radius:10px;border:1px solid var(--xzq-border,#e5e0d5);text-align:center;max-width:120px}
.sc-zrow button{font-size:15px;padding:10px 18px;border-radius:10px;border:1px solid var(--xzq-border,#e5e0d5);background:#f5c518;cursor:pointer}
.sc-worklink{color:#b78a00;cursor:pointer}
</style>
</head>
<body>
<header class="topbar nav">
  <a href="index.html" class="back">← 返回</a>
  <span id="navtitle">古诗词</span>
</header>

<main class="listwrap">
  <div id="sclist"></div>
  <div id="scdetail" style="display:none"></div>
  <p class="sc-src" id="scsrc"></p>
</main>

<script>
/* 被首页以 iframe 嵌入时隐藏本页顶栏 */
if (window.self !== window.top) {
  var tb = document.querySelector('.topbar');
  if (tb) tb.style.display = 'none';
}
</script>
<script src="data/shici.js"></script>
<script src="data/shiju.js"></script>
<script>
(function(){
var D = window.NHZ_SHICI || {poems:[]};
var SHIJU = (window.NHZ_SHIJU && window.NHZ_SHIJU.idx) || {};
var listEl = document.getElementById('sclist');
var detEl = document.getElementById('scdetail');
var navTitle = document.getElementById('navtitle');
document.getElementById('scsrc').textContent = '诗文：' + (D.src || '');

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showList(){ detEl.style.display='none'; listEl.style.display='block'; window.scrollTo(0,0); }
function showDetail(){ listEl.style.display='none'; detEl.style.display='block'; window.scrollTo(0,0); }
function setTitle(t){ if(navTitle) navTitle.textContent = t; }
function poemByOrder(o){ for(var i=0;i<D.poems.length;i++) if(D.poems[i].order===o) return D.poems[i]; return null; }
function worksOf(name){ return D.poems.filter(function(p){return p.author===name;}); }

var SECTIONS = [
  {id:'know', icon:'📖', t:'诗词常识', d:'体裁、格律、押韵、平仄、对仗——12张常识卡，可直接做成知识条目'},
  {id:'dyn', icon:'🏛️', t:'朝代长河', d:'诗经→楚辞→汉乐府→唐诗→宋词→元曲，一条时间线讲清每个时代为什么写这种体裁'},
  {id:'poets', icon:'👤', t:'诗人小传', d:'李白、杜甫、苏轼、李清照等：生平一句话＋代表作＋一个小故事'},
  {id:'famous', icon:'✨', t:'名句典故', d:'每句名句配出处、白话、典故（如“床前明月光”背后的思乡意象）'},
  {id:'imagery', icon:'🗺️', t:'意象地图', d:'月=思乡、柳=送别、菊=隐逸、梅=高洁……可点开的意象网络'},
  {id:'zilian', icon:'🔗', t:'字→诗句链', d:'输入一个字，找出含这个字的诗句；字卡里也能直接跳过来'}
];

function vHome(){
  setTitle('古诗词');
  var h = '<div class="sc-grid">' + SECTIONS.map(function(s){
    return '<div class="sc-card" data-go="'+s.id+'"><h3>'+s.icon+' '+esc(s.t)+'</h3><p>'+esc(s.d)+'</p></div>';
  }).join('') + '</div>';
  h += '<button class="sc-backbtn" data-go="poems">📜 诗库（全部'+D.poems.length+'首）</button>';
  listEl.innerHTML = h; showList();
  listEl.querySelectorAll('[data-go]').forEach(function(el){
    el.addEventListener('click', function(){ go(el.getAttribute('data-go')); });
  });
}

function vKnow(){
  setTitle('诗词常识');
  var h = '<button class="sc-backbtn" data-go="home">← 返回古诗词</button>';
  h += D.knowledge.map(function(k){
    return '<div class="sc-know"><h3>'+esc(k.t)+'</h3><p>'+esc(k.b)+'</p></div>';
  }).join('');
  listEl.innerHTML = h; showList(); wireBack();
}

function vDyn(){
  setTitle('朝代长河');
  var h = '<button class="sc-backbtn" data-go="home">← 返回古诗词</button><div style="padding:14px 0">';
  h += D.dynasties.map(function(d){
    return '<div class="sc-dyn"><h3>'+esc(d.name)+'</h3><div class="sc-dyntime">'+esc(d.time)+' · '+esc(d.tag)+'</div><p>'+esc(d.desc)+'</p><p class="sc-why">💡 为什么是这个体裁：'+esc(d.why)+'</p></div>';
  }).join('') + '</div>';
  listEl.innerHTML = h; showList(); wireBack();
}

function wireBack(){
  listEl.querySelectorAll('[data-go]').forEach(function(el){
    el.addEventListener('click', function(){ go(el.getAttribute('data-go')); });
  });
}

function vPoets(){
  setTitle('诗人小传');
  var names = Object.keys(D.poets).sort();
  var h = '<button class="sc-backbtn" data-go="home">← 返回古诗词</button>';
  h += names.map(function(n){
    return '<div class="sc-poet" data-poet="'+esc(n)+'"><div class="sc-pname">'+esc(n)+'</div><div class="sc-pbio">'+esc(D.poets[n]).slice(0,60)+'……</div></div>';
  }).join('');
  listEl.innerHTML = h; showList(); wireBack();
  listEl.querySelectorAll('[data-poet]').forEach(function(el){
    el.addEventListener('click', function(){ openPoet(el.getAttribute('data-poet')); });
  });
}

function openPoet(name){
  setTitle(name);
  var works = worksOf(name);
  var h = '<div class="sc-detail-head"><h2>'+esc(name)+'</h2></div>';
  h += '<div class="sc-know"><p>'+esc(D.poets[name]||'')+'</p></div>';
  if(D.stories && D.stories[name]){
    h += '<div class="sc-story"><h4>📖 小故事</h4><p>'+esc(D.stories[name])+'</p></div>';
  }
  h += '<div class="sc-know"><h3>代表作（'+works.length+'）</h3><p>' +
    works.map(function(p){return '<span class="sc-worklink" data-o="'+p.order+'">《'+esc(p.title)+'》</span>';}).join(' · ') +
    '</p></div>';
  h += '<button class="sc-backbtn" id="scback">← 返回诗人列表</button>';
  detEl.innerHTML = h; showDetail();
  document.getElementById('scback').addEventListener('click', function(){ vPoets(); });
  detEl.querySelectorAll('.sc-worklink').forEach(function(a){
    a.addEventListener('click', function(){ openPoem(parseInt(a.getAttribute('data-o'),10)); });
  });
}

function vFamous(){
  setTitle('名句典故');
  var h = '<button class="sc-backbtn" data-go="home">← 返回古诗词</button>';
  h += D.famous.map(function(f){
    var link = f.order ? '<div class="sc-flink">📜 出自<span class="sc-worklink" data-o="'+f.order+'">《'+esc(f.title)+'》</span>（'+esc(f.author)+'）</div>' : '<div class="sc-flink">📜 '+esc(f.author)+'《'+esc(f.title)+'》</div>';
    return '<div class="sc-famous"><div class="sc-fline">'+esc(f.line)+'</div><div class="sc-fbai">白话：'+esc(f.baihua)+'</div><div class="sc-fstory">典故：'+esc(f.story)+'</div>'+link+'</div>';
  }).join('');
  listEl.innerHTML = h; showList(); wireBack();
  listEl.querySelectorAll('.sc-worklink').forEach(function(a){
    a.addEventListener('click', function(){ openPoem(parseInt(a.getAttribute('data-o'),10)); });
  });
}

function imageryNetworkSVG(){
  var cx=180, cy=168, r1=60, r2=126;
  var n = D.imagery.length;
  var poemOrder = [];
  D.imagery.forEach(function(g){ g.poems.forEach(function(o){ if(poemOrder.indexOf(o)<0) poemOrder.push(o); }); });
  var m = poemOrder.length;
  var s = '<svg viewBox="0 0 360 336" style="width:100%;max-width:430px;display:block;margin:0 auto">';
  D.imagery.forEach(function(g,i){
    var a = (i/n)*Math.PI*2 - Math.PI/2;
    var x1 = cx + r1*Math.cos(a), y1 = cy + r1*Math.sin(a);
    g.poems.forEach(function(o){
      var j = poemOrder.indexOf(o);
      var b = (j/m)*Math.PI*2 - Math.PI/2;
      s += '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+(cx+r2*Math.cos(b)).toFixed(1)+'" y2="'+(cy+r2*Math.sin(b)).toFixed(1)+'" stroke="#f5c518" stroke-width="1" opacity="0.22"/>';
    });
  });
  poemOrder.forEach(function(o,j){
    var b = (j/m)*Math.PI*2 - Math.PI/2;
    var p = poemByOrder(o);
    s += '<g data-poem="'+o+'" style="cursor:pointer"><title>'+esc(p?p.title:'')+'</title><circle cx="'+(cx+r2*Math.cos(b)).toFixed(1)+'" cy="'+(cy+r2*Math.sin(b)).toFixed(1)+'" r="5" fill="#8a8578"/></g>';
  });
  D.imagery.forEach(function(g,i){
    var a = (i/n)*Math.PI*2 - Math.PI/2;
    var x = cx + r1*Math.cos(a), y = cy + r1*Math.sin(a);
    s += '<g data-im="'+i+'" style="cursor:pointer"><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="15" fill="#1c1c1e" stroke="#f5c518" stroke-width="1.5"/><text x="'+x.toFixed(1)+'" y="'+(y+6).toFixed(1)+'" text-anchor="middle" font-size="16" fill="#f5c518">'+esc(g.zi)+'</text></g>';
  });
  return s + '</svg>';
}

function vImagery(){
  setTitle('意象地图');
  var h = '<button class="sc-backbtn" data-go="home">← 返回古诗词</button>';
  h += '<div class="sc-know"><p>每个意象都连着几首诗——点中间的字，看它背后的诗句；点外圈的点，直达那首诗。</p></div>';
  h += imageryNetworkSVG();
  h += D.imagery.map(function(g,i){
    return '<div class="sc-poet" data-im="'+i+'"><div class="sc-pname">'+esc(g.zi)+' · '+esc(g.mean)+'</div><div class="sc-pbio">“'+esc(g.line)+'”</div></div>';
  }).join('');
  listEl.innerHTML = h; showList(); wireBack();
  listEl.querySelectorAll('[data-im]').forEach(function(el){
    el.addEventListener('click', function(){ openImagery(parseInt(el.getAttribute('data-im'),10)); });
  });
  listEl.querySelectorAll('[data-poem]').forEach(function(el){
    el.addEventListener('click', function(e){ e.stopPropagation(); openPoem(parseInt(el.getAttribute('data-poem'),10)); });
  });
}

function openImagery(i){
  var g = D.imagery[i];
  setTitle('意象 · '+g.zi);
  var h = '<div class="sc-detail-head"><h2 style="font-size:44px">'+esc(g.zi)+'</h2><div class="sc-detail-meta">'+esc(g.mean)+'</div></div>';
  h += '<div class="sc-know"><p style="font-size:17px">“'+esc(g.line)+'”</p></div>';
  h += '<div class="sc-know"><p>'+esc(g.desc)+'</p></div>';
  h += '<div class="sc-know"><h3>相关诗句</h3><p>' + g.poems.map(function(o){
    var p = poemByOrder(o);
    return p ? '<span class="sc-worklink" data-o="'+o+'">《'+esc(p.title)+'》</span>' : '';
  }).join(' · ') + '</p></div>';
  h += '<button class="sc-backbtn" id="scback">← 返回意象地图</button>';
  detEl.innerHTML = h; showDetail();
  document.getElementById('scback').addEventListener('click', function(){ vImagery(); });
  detEl.querySelectorAll('.sc-worklink').forEach(function(a){
    a.addEventListener('click', function(){ openPoem(parseInt(a.getAttribute('data-o'),10)); });
  });
}

function vZilian(preZi){
  setTitle('字→诗句链');
  var h = '<button class="sc-backbtn" data-go="home">← 返回古诗词</button>';
  h += '<div class="sc-know"><p>输入一个汉字，找出诗库里含这个字的<b>原句</b>，字会标黄。字卡里的“诗句里的这个字”也是从这里链过来的。</p></div>';
  h += '<div class="sc-zrow"><input id="ziinput" maxlength="1" placeholder="如：月"><button id="zigo">找诗句</button></div>';
  h += '<div class="sc-chips">' + ['月','柳','剑','酒','山','花','风','雪'].map(function(z){
    return '<span class="sc-chip" data-zi="'+z+'">'+z+'</span>';
  }).join('') + '</div>';
  h += '<div id="ziresult"></div>';
  listEl.innerHTML = h; showList(); wireBack();
  function run(zi){
    var box = document.getElementById('ziresult');
    var hits = [];
    D.poems.forEach(function(p){
      var ls = p.lines.filter(function(l){ return l.indexOf(zi) >= 0; });
      if(ls.length) hits.push({p:p, ls:ls.slice(0,3)});
    });
    if(!hits.length){ box.innerHTML = '<div class="sc-know"><p>“'+esc(zi)+'”在诗库里没有出现，换个字试试。</p></div>'; return; }
    var shown = hits.slice(0,20);
    box.innerHTML = '<div class="sc-know"><h3>含“'+esc(zi)+'”的诗句（'+hits.length+'首）</h3>' + shown.map(function(hh){
      var lines = hh.ls.map(function(l){
        return '<div class="sc-hitline">'+esc(l).split(esc(zi)).join('<mark>'+esc(zi)+'</mark>')+'</div>';
      }).join('');
      return '<div style="margin:10px 0 4px"><span class="sc-worklink" data-o="'+hh.p.order+'">《'+esc(hh.p.title)+'》</span><span style="font-size:12px;color:var(--xzq-muted,#8a8578)"> '+esc(hh.p.author)+'</span></div>' + lines;
    }).join('') + (hits.length>20?'<p style="font-size:13px;color:var(--xzq-muted,#8a8578)">还有 '+(hits.length-20)+' 首，在诗库里搜“'+esc(zi)+'”查看</p>':'') + '</div>';
    box.querySelectorAll('.sc-worklink').forEach(function(a){
      a.addEventListener('click', function(){ openPoem(parseInt(a.getAttribute('data-o'),10)); });
    });
  }
  document.getElementById('zigo').addEventListener('click', function(){
    var v = document.getElementById('ziinput').value.trim(); if(v) run(v);
  });
  listEl.querySelectorAll('[data-zi]').forEach(function(el){
    el.addEventListener('click', function(){ document.getElementById('ziinput').value = el.getAttribute('data-zi'); run(el.getAttribute('data-zi')); });
  });
  if(preZi){ document.getElementById('ziinput').value = preZi; run(preZi); }
}

var poemQ = '', poemDyn = 'all';
function vPoems(){
  setTitle('诗库');
  var dyns = ['all','唐','宋','五代','晋'];
  var h = '<button class="sc-backbtn" data-go="home">← 返回古诗词</button>';
  h += '<div class="searchbox" style="padding:10px 16px 0"><input id="pq" type="text" placeholder="搜诗名 / 诗人 / 诗句" value="'+esc(poemQ)+'" autocomplete="off"></div>';
  h += '<div class="sc-chips">' + dyns.map(function(d){
    return '<span class="sc-chip'+(poemDyn===d?' active':'')+'" data-dyn="'+d+'">'+(d==='all'?'全部':d)+'</span>';
  }).join('') + '</div><div id="poemlist"></div>';
  listEl.innerHTML = h; showList(); wireBack();
  function render(){
    var q = poemQ.trim();
    var arr = D.poems.filter(function(p){
      if(poemDyn!=='all' && p.dynasty!==poemDyn) return false;
      if(!q) return true;
      return p.title.indexOf(q)>=0 || p.author.indexOf(q)>=0 || p.lines.join('').indexOf(q)>=0;
    });
    document.getElementById('poemlist').innerHTML = arr.map(function(p){
      return '<div class="sc-poem" data-o="'+p.order+'"><div class="sc-ptitle">'+esc(p.title)+'</div><div class="sc-pmeta"><span class="sc-badge">'+esc(p.dynasty||'')+'</span><span class="sc-badge">'+esc(p.ticai||'')+'</span>'+esc(p.author)+'</div></div>';
    }).join('');
    document.getElementById('poemlist').querySelectorAll('.sc-poem').forEach(function(el){
      el.addEventListener('click', function(){ openPoem(parseInt(el.getAttribute('data-o'),10)); });
    });
  }
  document.getElementById('pq').addEventListener('input', function(e){ poemQ = e.target.value; render(); });
  listEl.querySelectorAll('[data-dyn]').forEach(function(el){
    el.addEventListener('click', function(){ poemDyn = el.getAttribute('data-dyn'); vPoems(); });
  });
  render();
}

function openPoem(order){
  var p = poemByOrder(order);
  if(!p){ vHome(); return; }
  setTitle(p.title);
  var h = '<div class="sc-detail-head"><h2>'+esc(p.title)+'</h2><div class="sc-detail-meta">'+esc(p.author)+' · '+esc(p.dynasty||'')+' · '+esc(p.ticai||'')+'</div></div>';
  h += '<div class="sc-lines">'+p.lines.map(function(l){return '<p>'+esc(l)+'</p>';}).join('')+'</div>';
  h += '<button class="sc-backbtn" id="scback">← 返回</button>';
  detEl.innerHTML = h; showDetail();
  document.getElementById('scback').addEventListener('click', function(){ showList(); });
  try{ history.replaceState(null,'','#poem-'+order); }catch(e){}
}

function go(v){
  try{ history.replaceState(null,'',' '); }catch(e){}
  if(v==='home') vHome();
  else if(v==='know') vKnow();
  else if(v==='dyn') vDyn();
  else if(v==='poets') vPoets();
  else if(v==='famous') vFamous();
  else if(v==='imagery') vImagery();
  else if(v==='zilian') vZilian();
  else if(v==='poems') vPoems();
  else vHome();
}

/* 深链：shici.html#poem-12 / shici.html#zilian-月 */
(function init(){
  var hash = location.hash || '';
  var m = hash.match(/#poem-(\d+)/);
  var mz = hash.match(/#zilian-(.+)/);
  if(m){ openPoem(parseInt(m[1],10)); }
  else if(mz){ vZilian(decodeURIComponent(mz[1])); }
  else vHome();
})();
})();
</script>
