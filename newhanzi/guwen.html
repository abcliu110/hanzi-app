<style>
.gw-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.gw-card{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface);cursor:pointer;align-self:start}
.gw-card h3{margin:0 0 6px;font-size:18px}
.gw-card p{margin:0;color:var(--muted);font-size:14px}
.gw-item{padding:14px 16px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:var(--surface);cursor:pointer}
.gw-item:active{background:var(--accent-soft)}
.gw-ititle{font-size:18px;font-weight:bold}
.gw-imeta{margin-top:4px;font-size:13px;color:var(--muted)}
.gw-backbtn{display:block;width:100%;text-align:center;padding:13px;border-radius:12px;border:2px solid var(--accent-deep);background:var(--accent);font-size:17px;font-weight:700;cursor:pointer;margin:12px 0;color:#fff}
@media (prefers-color-scheme: dark){.gw-backbtn{color:#14211a}}
.gw-head{text-align:center;padding:20px 16px 6px}
.gw-head h2{margin:0;font-size:26px}
.gw-meta{margin-top:8px;font-size:14px;color:var(--muted)}
.gw-sec{margin:20px 0 6px;font-size:17px;font-weight:bold}
.gw-yuanwen{font-family:Georgia,"Songti SC","SimSun",serif;font-size:19px;line-height:1.9;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.gw-p{font-size:16px;line-height:1.8;padding:0 4px}
.gw-eg{font-family:Georgia,"Songti SC","SimSun",serif;font-size:17px;line-height:1.9;padding:0 4px;margin:8px 0}
.gw-words{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.gw-word{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);font-size:15px}
.gw-word b{color:var(--accent-deep)}
.gw-tag{display:inline-block;background:var(--accent-soft);color:var(--accent-deep);font-size:12px;border-radius:8px;padding:1px 7px;margin-left:6px}
.gw-input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:16px;margin:8px 0}
.gw-filterbtn{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:15px;cursor:pointer;margin:0 8px 8px 0}
.gw-filterbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.gw-chips{padding:10px 0;display:flex;flex-wrap:wrap;gap:8px}
.gw-chip{padding:6px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer;color:var(--ink)}
.gw-chip.active{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff}
.gw-linkbtn{display:block;text-align:center;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;margin:8px 0;color:var(--accent-deep);text-decoration:none}
.gw-kc-sum{font-size:15px;color:var(--muted);padding:0 4px;margin:4px 0 8px}
.gw-kc{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;background:var(--surface);color:var(--ink);font-size:15px;cursor:pointer}
.gw-kc b{color:var(--accent-deep)}
.gw-kc .gw-kc-ex{display:block;margin-top:4px;font-family:Georgia,"Songti SC","SimSun",serif;font-size:16px;color:var(--muted)}
.gw-from{display:inline-block;padding:6px 12px;border-radius:16px;border:1px solid var(--accent-deep);background:var(--surface);color:var(--accent-deep);font-size:14px;cursor:pointer;margin:4px 6px 4px 0}
.gw-src{margin-top:16px;font-size:13px;color:var(--muted);text-align:center}
a:focus-visible,button:focus-visible,input:focus-visible,.gw-card:focus-visible,.gw-item:focus-visible,.yw-head:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>

<script>

<script>
(function(){
  'use strict';
  var D = window.NHZ_GUWEN || {texts: []};
  /* 篇目 ↔ 知识点双向链接：tools/content/build_guwen_links.py 离线生成（例句逐字命中原文），缺文件时两处区块都不显示 */
  var LINKS = window.NHZ_GUWEN_LINKS || {byText: {}, byPoint: {}};
  /* 知识数据：语法模块式结构 {categories:[{id,name,icon,intro,items:[点]}]}。
     点字段与语法模块一致：讲解、口诀、例子、分类、深讲、怎么认、辨析、例句解析、易错、动手练（练习）、小测。
     题库 key 用“子模块:点名”（如 xuci:而），不用裸点名：裸名在子模块间会撞（安在实词与一词多义、
     见/去/何/若/乃跨多个子模块），命名空间 key 才能保证题库挂到正确的点上。 */
  var K = window.NHZ_GUWEN_KNOWLEDGE || {categories: []};
  /* 题库：每子模块一个 bank 脚本（guwen/quiz_bank_guwen_<子模块>.js），进入该子模块时才 <script> 加载
     （file:// 下也能用；合并式写入，不覆盖）。bankData 与 window.NHZ_GUWEN_BANK 是同一个对象。 */
  var bankData = window.NHZ_GUWEN_BANK = window.NHZ_GUWEN_BANK || {};
  var bankLoaded = {};
  function loadBank(mid, cb){
    if(bankLoaded[mid] === true){ cb(); return; }
    if(bankLoaded[mid]){ bankLoaded[mid].push(cb); return; }
    bankLoaded[mid] = [cb];
    var sc = document.createElement('script');
    sc.src = 'guwen/quiz_bank_guwen_' + mid + '.js';
    function fin(){ var q = bankLoaded[mid]; bankLoaded[mid] = true; (q || []).forEach(function(f){ f(); }); }
    sc.onload = fin; sc.onerror = fin;
    document.head.appendChild(sc);
  }
  var bankState = {};
  var bankQuizData = {};
/* 复习/错题统一记录（与 fuxi.js 同款 helper，保持一致，勿单改一处）：
   答错 -> 进错题本并安排明天复习；答对复习项 -> 推进间隔。静默失败，不影响答题反馈。 */
window.NHZReview = window.NHZReview || (function () {
  var WK = 'nhz_wrong', SK = 'nhz_srs';
  var IV = [1, 2, 4, 7, 15, 30];
  function load(k, fb) {
    try { var v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? fb : v; }
    catch (e) { return fb; }
  }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function hash(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return 'q' + (h < 0 ? -h : h);
  }
  function idOf(it) { return hash(it.q + '\n' + (it.options || []).join('\n') + '\n' + it.answer); }
  function record(it, correct) {
    if (!it || !it.q) return;
    var id = idOf(it);
    var wrong = load(WK, []), srs = load(SK, {}), now = Date.now();
    if (correct) {
      if (srs[id]) {
        var iv = Math.min(srs[id].iv + 1, IV.length - 1);
        srs[id] = { iv: iv, next: now + IV[iv] * 86400000 };
        save(SK, srs);
      }
    } else {
      var found = false;
      for (var i = 0; i < wrong.length; i++) {
        if (wrong[i].id === id) {
          wrong[i] = { id: id, q: it.q, options: it.options || [], answer: it.answer,
            解析: it['解析'] || '', src: it.src, point: it.point, addedAt: wrong[i].addedAt || now };
          found = true; break;
        }
      }
      if (!found) wrong.push({ id: id, q: it.q, options: it.options || [], answer: it.answer,
        解析: it['解析'] || '', src: it.src, point: it.point, addedAt: now });
      save(WK, wrong);
      srs[id] = { iv: 0, next: now + IV[0] * 86400000 };
      save(SK, srs);
    }
  }
  function review(id, remembered) {
    var srs = load(SK, {}), now = Date.now();
    if (!srs[id]) return false;
    if (remembered) {
      var iv = Math.min(srs[id].iv + 1, IV.length - 1);
      srs[id] = { iv: iv, next: now + IV[iv] * 86400000 };
    } else {
      srs[id] = { iv: 0, next: now + IV[0] * 86400000 };
    }
    save(SK, srs);
    return true;
  }
  function clearWrong(id) {
    var wrong = load(WK, []), srs = load(SK, {}), nw = [];
    for (var i = 0; i < wrong.length; i++) if (wrong[i].id !== id) nw.push(wrong[i]);
    save(WK, nw);
    if (srs[id]) { delete srs[id]; save(SK, srs); }
  }
  return { record: record, review: review, clearWrong: clearWrong,
    loadWrong: function () { return load(WK, []); },
    loadSrs: function () { return load(SK, {}); } };
})();
  var quizData = {};
  var quizRecorded = {}; /* 动手练/小测只记首次作答（反馈仍可重答，不改反馈） */
  var currentItems = {};
  var MODS = [
    {id:'pianmu', icon:'📜', t:'古文篇目', d:'50篇 · 论语、寓言、史记、世说、唐宋八大家'},
    {id:'xuci', icon:'🔤', t:'虚词', d:'21个点 · 用法、例句、辨析、题库'},
    {id:'shici', icon:'📝', t:'实词', d:'120个点 · 含55个初中优先'},
    {id:'yufa', icon:'🧩', t:'语法', d:'句子成分、特殊句式、固定句式'},
    {id:'tongjia', icon:'🔁', t:'通假', d:'16个点 · 通假字读本字'},
    {id:'guyin', icon:'⚖️', t:'古今异义', d:'16个点 · 古今意思大不同'},
    {id:'duoyi', icon:'🌿', t:'一词多义', d:'12个点 · 一字多义看语境'},
    {id:'huoyong', icon:'🔄', t:'词类活用', d:'按类型 · 换词性换意思'},
    {id:'lishi', icon:'🏯', t:'历史', d:'朝代、史事人典、制度'},
    {id:'wenxue', icon:'✒️', t:'文学常识', d:'作家作品、文体'},
    {id:'wenhua', icon:'🏺', t:'文化常识', d:'器物、度量衡、历法、节日、地理'},
    {id:'songdu', icon:'🔊', t:'诵读', d:'篇目积累、断句、语感'},
    {id:'fanyi', icon:'🔍', t:'翻译方法', d:'直译为主、留换删补调'},
    {id:'meiti', icon:'🎬', t:'视频动画图示', d:'只外链嵌入 · 不照搬'},
    {id:'gaopinci', icon:'⭐', t:'篇目高频字', d:'小学14篇与初中篇目重点字'},
    {id:'zongbiao', icon:'📊', t:'汇总总表', d:'按分类的字表总汇'}
  ];
  var SECTIONS = [
    {id:'论语选读', icon:'📖', t:'论语选读', d:'6 篇 · 孔子的话，学与思'},
    {id:'寓言故事', icon:'🦊', t:'寓言故事', d:'13 篇 · 小故事，大道理'},
    {id:'名家短篇', icon:'🏯', t:'名家短篇', d:'4 篇 · 陋室铭、爱莲说、桃花源记'},
    {id:'史记选读', icon:'📚', t:'史记选读', d:'6 篇 · 鸿门宴、完璧归赵、破釜沉舟'},
    {id:'世说新语', icon:'💬', t:'世说新语', d:'5 篇 · 咏雪、陈太丘、管宁割席'},
    {id:'唐宋八大家', icon:'🖋️', t:'唐宋八大家', d:'7 篇 · 师说、小石潭记、马说'},
    {id:'先秦散文', icon:'🏛️', t:'先秦散文', d:'6 篇 · 孟子庄子荀子、左传战国策'},
    {id:'魏晋散文', icon:'🎋', t:'魏晋散文', d:'3 篇 · 出师表、陈情表、兰亭集序'}
  ];
  var navEl = document.getElementById('gwnav');
  var listEl = document.getElementById('gwlist');
  var detEl = document.getElementById('gwdetail');
  var mlistEl = document.getElementById('gwmlist');
  var mdetEl = document.getElementById('gwmdetail');
  var curMod = null, curFilter = '', curJr = false;
  var lastTextList = '全部'; /* 篇目详情返回用：记住从哪个篇目列表进来（全部或分类） */
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function catById(id){
    for(var i=0;i<K.categories.length;i++) if(K.categories[i].id===id) return K.categories[i];
    return null;
  }
  function modMeta(id){
    for(var i=0;i<MODS.length;i++) if(MODS[i].id===id) return MODS[i];
    return {id:id, icon:'📖', t:id, d:''};
  }
  function hideAll(){
    navEl.style.display='none'; listEl.style.display='none'; detEl.style.display='none';
    mlistEl.style.display='none'; mdetEl.style.display='none';
  }
  /* ---------- 子模块列表（语法模块式 panel 网格） ---------- */
  function showNav(){
    hideAll(); navEl.style.display='block'; window.scrollTo(0,0);
    var h = '<div class="yw-grid">' + MODS.map(function(m){
      var n = m.id==='pianmu' ? D.texts.length : (catById(m.id) ? catById(m.id).items.length : 0);
      var unit = m.id==='pianmu' ? '篇' : '点';
      return '<button class="yw-head" data-mod="'+esc(m.id)+'"><span class="yw-ico">'+m.icon+'</span><span class="yw-name">'+esc(m.t)+'</span><span class="yw-sub">'+n+unit+' · '+esc(m.d)+'</span><span class="yw-arrow">▾</span></button>';
    }).join('') + '</div>';
    navEl.innerHTML = h;
  }
  /* ---------- 篇目流（原有分类→列表→明细，原样不动） ---------- */
  function showSections(){
    hideAll(); listEl.style.display='block'; window.scrollTo(0,0);
    var h = '<button class="gw-backbtn" data-go="__nav">← 回子模块</button>';
    h += '<div class="gw-grid">' + SECTIONS.map(function(s){
      return '<div class="gw-card" data-go="'+esc(s.id)+'"><h3>'+s.icon+' '+esc(s.t)+'</h3><p>'+esc(s.d)+'</p></div>';
    }).join('') + '</div>';
    h += '<button class="gw-backbtn" data-go="全部">📜 全部篇目（共'+D.texts.length+'篇）</button>';
    listEl.innerHTML = h;
  }
  function showList(cat){
    lastTextList = cat;
    hideAll(); listEl.style.display='block'; window.scrollTo(0,0);
    var items = cat==='全部' ? D.texts : D.texts.filter(function(t){return t.cat===cat;});
    var h = '<button class="gw-backbtn" data-go="__sections">← 回分类</button>';
    h += items.map(function(t){
      var idx = D.texts.indexOf(t);
      return '<div class="gw-item" data-idx="'+idx+'"><div class="gw-ititle">'+esc(t.title)+'</div><div class="gw-imeta">'+esc(t.author)+' · '+esc(t.source)+' · '+esc(t.cat)+'</div></div>';
    }).join('');
    listEl.innerHTML = h;
  }
  function showDetail(idx){
    var t = D.texts[idx]; if(!t) return;
    hideAll(); detEl.style.display='block'; window.scrollTo(0,0);
    var h = '<button class="gw-backbtn" data-go="__back">← 回篇目</button>';
    h += '<div class="gw-head"><h2>'+esc(t.title)+'</h2><div class="gw-meta">'+esc(t.author)+' · '+esc(t.source)+'</div></div>';
    h += '<div class="gw-sec">📖 原文</div><div class="gw-yuanwen">'+esc(t.原文)+'</div>';
    h += '<div class="gw-sec">💡 导读</div><p class="gw-p">'+esc(t.导读)+'</p>';
    h += '<div class="gw-sec">🔍 译意</div><p class="gw-p">'+esc(t.译意)+'</p>';
    h += '<div class="gw-sec">📝 重点字词</div><div class="gw-words">'+t.重点.map(function(w){
      return '<div class="gw-word"><b>'+esc(w[0])+'</b>：'+esc(w[1])+'</div>';
    }).join('')+'</div>';
    h += knowCardHtml(t.title);
    detEl.innerHTML = h;
    detEl.dataset.back = lastTextList || t.cat;
  }
  /* 本篇文言知识卡：按子模块顺序汇总「虚词 3 · 通假 1 …」，每条点开跳到该知识点 */
  function knowCardHtml(title){
    var rows = (LINKS.byText || {})[title];
    if(!rows || !rows.length) return '';
    var order = MODS.map(function(m){ return m.id; });
    rows = rows.slice().sort(function(a, b){ return order.indexOf(a.mid) - order.indexOf(b.mid) || a.i - b.i; });
    var cnt = {}, seq = [];
    rows.forEach(function(r){ if(!cnt[r.mid]){ cnt[r.mid] = 0; seq.push(r.mid); } cnt[r.mid]++; });
    var h = '<div class="gw-sec" id="gwKnowCard">🗂 本篇文言知识卡</div>';
    h += '<p class="gw-kc-sum">本篇：' + seq.map(function(mid){ return esc(modMeta(mid).t) + ' ' + cnt[mid]; }).join(' · ') + '</p>';
    h += rows.map(function(r){
      var m = modMeta(r.mid);
      return '<button class="gw-kc" data-gwpoint="'+esc(r.mid)+':'+r.i+'">'+m.icon+' '+esc(m.t)+' · <b>'+esc(r.name)+'</b> →' +
        '<span class="gw-kc-ex">'+esc(r.ex)+'</span></button>';
    }).join('');
    h += '<p class="gw-src">知识卡按知识库例句与本篇原文逐字对上自动列出，没对上的知识点不硬凑。</p>';
    return h;
  }
  /* 知识点 → 出自哪些篇目（知识点详情底部） */
  function fromTextsHtml(modId, idx){
    var key = String(idx).replace(/_(\d+)$/, ':$1');
    var rows = (LINKS.byPoint || {})[key];
    if(!rows || !rows.length) return '';
    var seen = {};
    rows = rows.filter(function(r){ if(seen[r.t]) return false; seen[r.t] = 1; return textIdx(r.t) >= 0; });
    if(!rows.length) return '';
    return '<div class="gw-sec">📜 例句出自本库篇目</div><div>' + rows.map(function(r){
      return '<button class="gw-from" data-gwtext="'+esc(r.t)+'" title="'+esc(r.ex)+'">出自《'+esc(r.t)+'》→</button>';
    }).join('') + '</div>';
  }
  function textIdx(title){
    for(var i=0;i<D.texts.length;i++) if(D.texts[i].title===title) return i;
    return -1;
  }
  function openPoint(mid, i){
    showMList(mid);
    loadBank(mid, function(){
      if(curMod !== mid) return;
      var key = mid + '_' + i;
      if(!currentItems[key]) renderMItems();
      if(currentItems[key]) showMDetail(key);
    });
  }
  /* ---------- 题库（语法模块 bank 机制，key 为点 key） ---------- */
  function bankFiltered(bid){
    var st = bankState[bid];
    var qs = bankData[st.key].questions;
    if(!st.filter || st.filter==='全部') return qs;
    return qs.filter(function(q){ return q['类']===st.filter; });
  }
  function bankHeadHtml(bid){
    var st = bankState[bid];
    var qs = bankFiltered(bid);
    var end = Math.min(st.offset+10, qs.length);
    var label = (st.filter && st.filter!=='全部') ? '（'+st.filter+'）' : '';
    return '第 '+(st.offset+1)+'–'+end+' 道 / 共 '+qs.length+' 道'+label+' · 本轮答对 '+st.score+' / 已答 '+st.answered;
  }
  function bankBatchHtml(bid){
    var st = bankState[bid];
    var qs = bankFiltered(bid);
    var batch = qs.slice(st.offset, st.offset+10);

  /* 内容分型：8型（CONTENT_PATTERNS.md v2.0），按子模块id映射 */
  function itemType(modId){

    if(m==='xuci' || m==='guyin') return '辨析';
    if(m==='shici' || m==='duoyi' || m==='gaopinci') return '词条';
    if(m==='yufa' || m==='huoyong') return '规律';
    if(m==='songdu' || m==='fanyi') return '程序';
    if(m==='lishi') return '故事';
    if(m==='tongjia' || m==='wenxue' || m==='wenhua' || m==='meiti' || m==='zongbiao') return '清单';

  var TYPE_LABEL = { '规律':'规律型', '辨析':'辨析型', '程序':'程序型', '词条':'词条型', '故事':'故事型', '清单':'清单型', '材料':'材料型' };
  var TYPE_COLOR = { '规律':'#3d5a40', '辨析':'#5a4a7a', '程序':'#7a5a3a', '词条':'#4a7a59', '故事':'#8a5a44', '清单':'#5a6a7a', '材料':'#7a6a3d' };

  /* ---------- 点渲染（语法模块渲染顺序 + 按型节标题） ---------- */
  function itemHtml(it, idx, icon, modId){

    var step = 0;

    /* 按型定的节标题（内容零删减，只换标题） */
    var T = {
      '规律': { analogy:'💡 啊哈现象', rule:'一句话', ex:'例组', bad:'病例' },
      '辨析': { analogy:'💡 啊哈现象', rule:'辨析对照', ex:'分水岭例句', bad:'天坑病例' },
      '词条': { analogy:'💡 啊哈现象', rule:'释义精讲', ex:'例组', bad:'易错诊所' },
      '程序': { analogy:'💡 啊哈现象', rule:'一句话', ex:'全程演示', bad:'易错诊所' },
      '故事': { analogy:'💡 啊哈现象', rule:'时间轴', ex:'关键节点', bad:'易错诊所' },
      '清单': { analogy:'💡 啊哈现象', rule:'一览', ex:'例组', bad:'易错诊所' }
    }[tp] || { analogy:'💡 啊哈现象', rule:'一句话', ex:'例组', bad:'病例' };
    /* 规则一句话 */
    if(it['讲解'] || it['口诀'] || (it['例子'] && it['例子'].length)){
      body += stepHead(T.rule);

          '<span class="yw-fl-rep">' + esc(c['代表'] || '') + '</span></div>' +

    if(it['怎么认'] && it['怎么认'].length){

        body += stepHead('🃏 步骤卡') + '<div class="yw-stepcards">' +
          it['怎么认'].map(function(s, si){

    if(it['类比']) body += stepHead(T.analogy) + '<div class="yw-analogy">' + it['类比'] + '</div>';

    /* 辨析：guyin模块的"古义是X，今义是Y"解析为对照表，其余保持原文 */

        if(bxm){

            '<table style="width:100%;border-collapse:collapse;font-size:14px;margin:8px 0">' +
            '<tr><th style="border:1px solid #d5dfd0;padding:8px 10px;background:#f8faf5;text-align:left">古义</th>' +

            '<td style="border:1px solid #d5dfd0;padding:8px 10px">' + esc(bxm[2]) + '</td></tr></table>';
        }
      }
      body += bxHtml;
    }
    /* 例句解析：程序型标题为全程演示 */
    if(it['例句解析'] && it['例句解析'].length) body += stepHead(tp === '程序' ? '🎬 全程演示' : '例句解析') +
      it['例句解析'].map(function(e){
        return '<p class="yw-exp">📝 ' + esc(e['句'] || '') + '<br>↳ ' + esc(e['析'] || '') + '</p>';

    if(it['易错']) body += '<div class="warn">⚠️ ' + esc(it['易错']) + '</div>';
    /* 题库动手练：有点库的点用题库（每轮 10 道），不再重复显示样板 3 道 */
    var bk = it.key ? bankData[it.key] : null;
    if(bk && bk.questions && bk.questions.length){
      var bid = 'bank'+idx+'_'+Math.floor(Math.random()*100000);
      bankState[bid] = {key: it.key, offset: 0, score: 0, answered: 0, filter: '全部'};
      var bclasses = ['全部'];
      bk.questions.forEach(function(q){
        if(q['类'] && bclasses.indexOf(q['类']) < 0) bclasses.push(q['类']);
      });
      body += '<div class="yw-quiz yw-bank" id="' + bid + '">' +
        '<div class="yw-step"><span class="yw-stepnum">✏️</span><span class="yw-steptitle">动手练 · 题库</span></div>' +
        '<div class="bank-filters">' + bclasses.map(function(c){
          return '<button class="' + (c==='全部' ? 'on' : '') + '" data-bank-filter="' + bid + '|' + c + '">按类练：' + esc(c) + '</button>';
        }).join('') + '</div>' +
        '<p class="yw-exp bank-head">' + esc(bankHeadHtml(bid)) + '</p>' +
        '<div class="bank-qs">' + bankBatchHtml(bid) + '</div>' +
        '<button class="bank-next" data-bank-next="' + bid + '">再来 10 道 →</button></div>';
    }
    /* 动手练（每点 3 道带解析的选择题，按类分组） */
    if(it['练习'] && it['练习'].length && !bk){
      var groups = [];
      it['练习'].forEach(function(q){
        var gname = q['类'] || '综合';
        var g = null;
        for(var gi=0; gi<groups.length; gi++) if(groups[gi].name===gname) g = groups[gi];
        if(!g){ g = {name: gname, qs: []}; groups.push(g); }
        g.qs.push(q);
      });
      var qi = 0;
      body += '<div class="yw-quiz"><div class="yw-step"><span class="yw-stepnum">✏️</span><span class="yw-steptitle">动手练</span></div>' + groups.map(function(g){
        return '<div class="yw-lx-group"><div class="yw-lx-grouphead">按类练：' + esc(g.name) + '</div>' + g.qs.map(function(q){
          var qid = 'lx'+idx+'_'+(qi++)+'_'+Math.floor(Math.random()*100000);
          quizData[qid] = q;
          return '<div class="quiz-q" id="'+qid+'"><div class="quiz-t">'+esc(q.q)+'</div>'+
            '<div class="quiz-opts">'+q.options.map(function(op, oi){
              return '<button data-qid="'+qid+'" data-oi="'+oi+'">'+esc(op)+'</button>';
            }).join('')+'</div><div class="quiz-fb"></div></div>';
        }).join('') + '</div>';
      }).join('') + '</div>';
    }
    /* 小测（有则保留；古文点目前无小测） */
    if(it['小测'] && it['小测'].length){
      body += '<div class="yw-quiz">' + it['小测'].map(function(q, qi){
        var qid = 'q'+idx+'_'+qi+'_'+Math.floor(Math.random()*100000);
        quizData[qid] = q;
        return '<div class="quiz-q" id="'+qid+'"><div class="quiz-t">'+(qi+1)+'. '+esc(q.q)+'</div>'+
          '<div class="quiz-opts">'+q.options.map(function(op, oi){
            return '<button data-qid="'+qid+'" data-oi="'+oi+'">'+esc(op)+'</button>';
          }).join('')+'</div><div class="quiz-fb"></div></div>';
      }).join('') + '</div>';
    }
    /* 古文原有内容：外链与备注，放在最后保留 */
    if(it.links && it.links.length){
      body += '<div class="gw-sec">链接</div>' + it.links.map(function(l){
        return '<a class="gw-linkbtn" href="'+esc(l.u)+'" target="_blank" rel="noopener">'+esc(l.t)+'</a><p class="gw-p">'+esc(l.note || '')+'</p>';
      }).join('');
    }
    if(it.note) body += '<p class="gw-src">'+esc(it.note)+'</p>';
    body += fromTextsHtml(modId, idx);
    currentItems[idx] = {it: it, body: body, icon: icon};
    var bank = bk;
    return '<div class="yw-item">' +
      '<button class="yw-head" data-idx="'+idx+'"><span class="yw-ico">'+icon+'</span><span class="yw-name">'+esc(it.name || '')+'</span>' +
      (it['口诀'] ? '<span class="yw-kj">'+esc(it['口诀'])+'</span>' : '') +
      (it['subtitle'] ? '<span class="yw-sub">'+esc(it['subtitle'])+'</span>' : '') +
      '<span class="yw-badges">' +
      (hasVisual ? '<span class="yw-badge">✨图解</span>' : '') +
      (bank ? '<span class="yw-badge">📝'+bank.total+'道</span>' :
        (it['练习'] ? '<span class="yw-badge">📝动手练</span>' : '')) +
      '</span>' +
      '<span class="yw-arrow">▾</span></button>' +
      '<div class="yw-body" data-idx="'+idx+'">' + body + '</div></div>';
  }
  /* ---------- 点列表（语法模块式 panel 网格 + 搜索） ---------- */
  function renderMItems(){
    var cat = catById(curMod); if(!cat) return;
    var box = document.getElementById('gwMItems'); if(!box) return;
    var meta = modMeta(curMod);
    var q = curFilter.trim();
    var list = (cat.items || []).filter(function(it){
      if(curMod==='shici' && curJr && !it.jr) return false;
      if(!q) return true;
      return (it.name || '').indexOf(q) >= 0 ||
        (it['讲解'] || '').indexOf(q) >= 0 ||
        (it['深讲'] || '').indexOf(q) >= 0 ||
        (it['辨析'] || '').indexOf(q) >= 0 ||
        (it['口诀'] || '').indexOf(q) >= 0;
    });
    if(!list.length){ box.innerHTML = '<p class="gw-p">没有符合条件的知识点，换个词试试。</p>'; return; }
    box.innerHTML = '<div class="yw-grid">' + list.map(function(it){
      var idx = (cat.items || []).indexOf(it);
      return itemHtml(it, curMod+'_'+idx, meta.icon, curMod);
    }).join('') + '</div>';
  }
  function showMList(id, keepFilter){
    curMod = id;
    if(!keepFilter){ curFilter = ''; curJr = false; }
    var cat = catById(id);
    var meta = modMeta(id);
    hideAll(); mlistEl.style.display='block'; window.scrollTo(0,0);
    var h = '<button class="gw-backbtn" data-go="__nav">← 回子模块</button>';
    h += '<div class="gw-head"><h2>'+meta.icon+' '+esc(meta.t)+'</h2><div class="gw-meta">'+esc(meta.d)+'</div></div>';
    if(!cat){ h += '<p class="gw-p">这里还没有内容。</p>'; mlistEl.innerHTML = h; return; }
    h += '<div class="gw-chips">' + MODS.filter(function(m){return m.id!=='pianmu';}).map(function(m){
      return '<button class="gw-chip'+(m.id===id?' active':'')+'" data-mid="'+esc(m.id)+'">'+m.icon+' '+esc(m.t)+'</button>';
    }).join('') + '</div>';
    h += '<div class="ghead">'+esc(meta.t)+'<span class="gcount">'+cat.items.length+'点</span></div>';
    if(cat.intro) h += '<p class="gw-p">'+esc(cat.intro)+'</p>';
    h += '<input class="gw-input" id="gwSearch" placeholder="'+(id==='shici' ? '搜索实词或义项…' : '搜索知识点…')+'" value="'+esc(curFilter)+'">';
    if(id==='shici'){
      h += '<button class="gw-filterbtn'+(curJr ? ' on' : '')+'" id="gwJrBtn">只看初中优先</button>';
    }
    h += '<div id="gwMItems"></div>';
    mlistEl.innerHTML = h;
    var inp = document.getElementById('gwSearch');
    if(inp) inp.addEventListener('input', function(){ curFilter = inp.value; renderMItems(); });
    var jb = document.getElementById('gwJrBtn');
    if(jb) jb.addEventListener('click', function(){ curJr = !curJr; jb.className = curJr ? 'gw-filterbtn on' : 'gw-filterbtn'; renderMItems(); });
    mlistEl.querySelectorAll('.gw-chip').forEach(function(el){
      el.addEventListener('click', function(){
        var mid = el.getAttribute('data-mid');
        if(mid && mid!==id) showMList(mid);
      });
    });
    if(bankLoaded[id] === true) renderMItems();
    else {
      document.getElementById('gwMItems').innerHTML = '<p class="gw-p">加载中…</p>';
      loadBank(id, function(){ if(curMod === id && document.getElementById('gwMItems')) renderMItems(); });
    }
  }
  /* ---------- 点详情（移动节点，非复制） ---------- */
  function showMDetail(idx){
    var rec = currentItems[idx]; if(!rec) return;
    var it = rec.it;
    var headEl = mlistEl.querySelector('.yw-head[data-idx="'+idx+'"]');
    var itemEl = headEl ? headEl.closest('.yw-item') : null;
    var bodyEl = itemEl ? itemEl.querySelector('.yw-body') : null;
    hideAll(); mdetEl.style.display='block'; window.scrollTo(0,0);
    mdetEl.innerHTML =
      '<div style="display:flex;gap:10px;margin-bottom:16px">' +
      '<button class="gw-backbtn" style="margin:0" id="gwMBack">← 回列表</button></div>' +
      '<div class="yw-detail-head"><span class="yw-ico-lg">'+rec.icon+'</span>' +
      '<div><h2>'+esc(it.name || '')+'</h2>' +
      (it['口诀'] ? '<p class="yw-kj-lg">'+esc(it['口诀'])+'</p>' : '') + '</div></div>' +
      '<div class="yw-detail-body" id="gwDetailBody"></div>';

  function hideMDetail(){
    var bodyEl = document.querySelector('#gwDetailBody .yw-body');
    if(bodyEl){
      var idx = bodyEl.getAttribute('data-idx');
      var headEl = mlistEl.querySelector('.yw-head[data-idx="'+idx+'"]');
      if(headEl) headEl.closest('.yw-item').appendChild(bodyEl);
    }
    mdetEl.style.display='none'; mdetEl.innerHTML = '';
    mlistEl.style.display='block'; window.scrollTo(0,0);
  }
  document.addEventListener('click', function(e){
    var card = e.target.closest('[data-mod]');
    if(card){
      var mid = card.getAttribute('data-mod');
      if(mid==='pianmu') showSections(); else showMList(mid);
      return;
    }
    var gp = e.target.closest('[data-gwpoint]');
    if(gp){
      var pp = gp.getAttribute('data-gwpoint').split(':');
      openPoint(pp[0], parseInt(pp[1], 10));
      return;
    }
    var gt = e.target.closest('[data-gwtext]');
    if(gt){
      var ti = textIdx(gt.getAttribute('data-gwtext'));
      if(ti >= 0){ lastTextList = '全部'; showDetail(ti); }
      return;
    }
    var go = e.target.closest('[data-go]');
    if(go){
      var g = go.getAttribute('data-go');
      if(g==='__nav') showNav();
      else if(g==='__sections') showSections();
      else if(g==='__back') showList(detEl.dataset.back || '全部');
      else showList(g);
      return;
    }
    var head = e.target.closest('.yw-head');
    if(head && head.hasAttribute('data-idx') && mlistEl.style.display!=='none'){
      showMDetail(head.getAttribute('data-idx'));
      return;
    }
    var mi = e.target.closest('.gw-item');
    if(mi && mi.hasAttribute('data-idx')){ showDetail(parseInt(mi.getAttribute('data-idx'), 10)); return; }
    /* 题库按类过滤 */
    var fb = e.target.closest('[data-bank-filter]');
    if(fb){
      var parts = fb.getAttribute('data-bank-filter').split('|');
      var fbid = parts[0];
      var fst = bankState[fbid];
      if(!fst) return;
      e.stopPropagation();
      fst.filter = parts[1];
      fst.offset = 0; fst.score = 0; fst.answered = 0;
      renderBank(fbid);
      return;
    }
    /* 题库换批 */
    var nb = e.target.closest('[data-bank-next]');
    if(nb){
      var bid = nb.getAttribute('data-bank-next');
      var st = bankState[bid];
      if(!st) return;
      e.stopPropagation();
      var flen = bankFiltered(bid).length;
      if(flen) st.offset = (st.offset+10) % flen;
      st.score = 0; st.answered = 0;
      renderBank(bid);
      return;
    }
    /* 题库答题（防重复点击） */
    var bb = e.target.closest('[data-bqid]');
    if(bb){
      var bqid = bb.getAttribute('data-bqid');
      var boi = parseInt(bb.getAttribute('data-boi'), 10);
      var bq = bankQuizData[bqid];
      var bqbox = document.getElementById(bqid);
      if(!bq || !bqbox) return;
      e.stopPropagation();
      if(bqbox.getAttribute('data-done')) return;
      bqbox.setAttribute('data-done', '1');
      var bankBox = bqbox.closest('.yw-bank');
      var bid2 = bankBox ? bankBox.id : null;
      var st2 = bid2 ? bankState[bid2] : null;
      if(st2) st2.answered++;
      var bfb = bqbox.querySelector('.quiz-fb');
      var bbtns = bqbox.querySelectorAll('[data-boi]');
      for(var b2=0; b2<bbtns.length; b2++) bbtns[b2].classList.remove('right', 'wrong');
      if(boi===bq.answer){
        bb.classList.add('right');
        if(st2) st2.score++;
        bfb.innerHTML = '✅ 答对了！' + (bq['解析'] ? esc(bq['解析']) : '');
      }else{
        bb.classList.add('wrong');
        bbtns[bq.answer].classList.add('right');
        bfb.innerHTML = '❌ 再想想。' + (bq['解析'] ? esc(bq['解析']) : '');
      }
      /* 错题打通：答错进统一错题本（答对复习项推进间隔），不改反馈与计分 */
      NHZReview.record({q:bq.q, options:bq.options, answer:bq.options[bq.answer] || '',
        解析:bq['解析'] || '', src:'古文', point:st2 ? st2.key.split(':').pop() : ''}, boi===bq.answer);
      if(bankBox && st2) bankBox.querySelector('.bank-head').textContent = bankHeadHtml(bid2);
      return;
    }
    /* 动手练 / 小测答题 */
    var qb = e.target.closest('[data-qid]');
    if(qb){
      var qid = qb.getAttribute('data-qid');
      var oi = parseInt(qb.getAttribute('data-oi'), 10);
      var q = quizData[qid];
      var qbox = document.getElementById(qid);
      if(!q || !qbox) return;
      e.stopPropagation();
      var fb2 = qbox.querySelector('.quiz-fb');
      var btns = qbox.querySelectorAll('[data-oi]');
      for(var b=0; b<btns.length; b++) btns[b].classList.remove('right', 'wrong');
      if(oi===q.answer){
        qb.classList.add('right');
        fb2.innerHTML = '✅ 答对了！' + (q['解析'] ? esc(q['解析']) : '');
      }else{
        qb.classList.add('wrong');
        btns[q.answer].classList.add('right');
        fb2.innerHTML = '❌ 再想想。' + (q['解析'] ? esc(q['解析']) : '');
      }
      /* 错题打通（动手练/小测）：只记首次作答，不改反馈与计分 */
      if(!quizRecorded[qid]){
        quizRecorded[qid] = true;
        var qbody = qbox.closest('.yw-body');
        var qrec = qbody ? currentItems[qbody.getAttribute('data-idx')] : null;
        NHZReview.record({q:q.q, options:q.options, answer:q.options[q.answer] || '',
          解析:q['解析'] || '', src:'古文', point:qrec ? qrec.it.name : ''}, oi===q.answer);
      }
      return;
    }
  });
  if(!K.categories || !K.categories.length){
    navEl.innerHTML = '<p class="gw-p">知识库加载失败，请确认 data/guwen_knowledge.js 存在。</p>';
  }else{
    showNav();
  }
})();
</script>
</body>
</html>
