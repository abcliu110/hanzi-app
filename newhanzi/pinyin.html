<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼音 · newhanzi</title>
<link rel="stylesheet" href="zika.css">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* 拼音区：只用护眼套 token（FRONTEND_UI.md §1），平板 ≥768 / 桌面 ≥1200 两档（§2），导航走 NHZNavPage（§7） */
.py-wrap{max-width:1100px;margin:0 auto;padding:12px 16px 32px}
.py-intro{color:var(--muted);font-size:15px;line-height:1.7;margin:4px 2px 14px}
.py-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.py-card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-height:44px;cursor:pointer;color:var(--ink);font:inherit;transition:transform .15s,border-color .15s}
.py-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.py-card:focus-visible,.py-chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.py-card .no{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;border-radius:13px;background:var(--accent-soft);color:var(--accent-deep);font-size:13px;font-weight:700;margin-right:8px}
.py-card b{font-size:18px;color:var(--ink)}
.py-card .ex{font-family:"Noto Sans",system-ui,sans-serif;font-size:16px;color:var(--accent-deep);margin:8px 0 4px;letter-spacing:.5px}
.py-card .ds{font-size:13px;color:var(--muted);line-height:1.6}
.py-card .lv{float:right;font-size:12px;color:var(--accent-deep);border:1px solid var(--line);border-radius:8px;padding:1px 7px}
.py-sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 14px}
.py-sec h3{font-size:17px;margin:0 0 8px;color:var(--accent-deep)}
.py-sec p{font-size:15px;line-height:1.8;margin:6px 0;color:var(--ink)}
.py-sec .note{font-size:13px;color:var(--muted)}
.py-row{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.py-chip{min-width:56px;min-height:48px;padding:6px 12px;display:inline-flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:12px;font-family:"Noto Sans",system-ui,sans-serif;font-size:22px;color:var(--ink)}
.py-chip small{font-size:12px;color:var(--muted);margin-left:6px;font-family:inherit}
.py-grp{font-size:13px;color:var(--muted);margin:10px 0 2px}
.py-credit{font-size:12px;color:var(--muted);line-height:1.7;margin:24px 2px 0;border-top:1px solid var(--line);padding-top:10px}
.py-credit a{color:var(--accent-deep)}
.py-chip.is-play{cursor:pointer;border-color:var(--accent);background:var(--surface);transition:background .15s,transform .1s}
.py-chip.is-play:hover{background:var(--accent-soft)}
.py-chip.is-play:active,.py-chip.is-on,.py-tone.is-on{transform:scale(.96);background:var(--accent-soft)}
.py-chip.is-play[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent-deep)}
.py-chip.is-mute{color:var(--muted);border-style:dashed;cursor:default}
.py-chip.is-wait{color:var(--muted);border-style:dashed;cursor:default;flex-direction:column;line-height:1.1}
.py-chip.is-wait em{font-style:normal;font-size:11px;margin-top:2px;font-family:system-ui,sans-serif}
.py-pair{display:inline-flex;align-items:center;gap:4px}
.py-pair>i{font-style:normal;color:var(--muted)}
.py-tones{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:2px 0 10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.py-tones-h{font-size:14px;color:var(--muted);margin-right:4px}
.py-tone{min-width:64px;min-height:52px;padding:6px 12px;border:1px solid var(--accent);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-family:"Noto Sans",system-ui,sans-serif;font-size:26px;cursor:pointer}
.py-tone:hover{background:var(--accent-soft)}
.py-tone:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.py-tone.is-mute{border-style:dashed;color:var(--muted);cursor:default;display:inline-flex;align-items:center;justify-content:center}
.py-tones-n{font-size:13px;color:var(--muted)}
.py-todo{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-top:6px}
@media (min-width:768px){.py-wrap{padding:16px 24px 40px}}
@media (min-width:1200px){.py-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="py-wrap">
  <div id="pyHome">
    <p class="py-intro">按统编一年级上册的顺序学：先声调和单韵母，再声母和拼读，然后复韵母、鼻韵母和整体认读，最后是拼写规则和音变。</p>
    <div class="py-grid" id="pyGrid"></div>
  </div>
  <div id="pyDetail" style="display:none"></div>
  <p class="py-credit" id="pyCredit">音节录音：Chen Wang（王琛），来自 <a href="https://github.com/hugolpz/audio-cmn" target="_blank" rel="noopener">audio-cmn</a>（Hugo Lopez 整理），许可 <a href="https://creativecommons.org/licenses/by-sa/3.0/deed.zh" target="_blank" rel="noopener">CC BY-SA 3.0</a>，未改动。声母呼读音为自录。</p>
</div>
<script src="pinyin/data.js"></script>
<script src="pinyin/syllables.js"></script>
<script src="pinyin/syllable.js"></script>
<script src="pinyin/audio/index.js"></script>
<script src="pinyin/player.js"></script>
<script src="nav-up.js"></script>
<script src="pinyin.js"></script>
</body>
</html>
