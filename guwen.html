  function yuanwenHtml(t){

      buf = ''; sen++;

  /* ---------- 点列表（语法模块式 panel 网格 + 搜索） ---------- */

  /* 语法页 = 子面板：句子成分、特殊句式、固定句式（yufa 条目按 subtitle 分组）+ parent:'yufa' 的子模块（实词、虚词、词类活用、通假、古今异义、一词多义）+ 总说 */

    var YUFA_ORDER = ['g:总说','m:shici','m:duoyi','m:guyin','m:tongjia','m:huoyong','m:xuci','g:句子成分','g:特殊句式','g:固定句式'];

      }
      var m = modMeta(k.slice(2)), c = catById(m.id);
      return {key:k, icon:m.icon, t:m.t, n:c ? c.items.length : 0, d:m.d};

      '<div class="yw-detail-head"><span class="yw-ico-lg">'+rec.icon+'</span>' +
      '<div><h2>'+esc(it.name || '')+'</h2>' +
      (it['口诀'] ? '<p class="yw-kj-lg">'+esc(it['口诀'])+'</p>' : '') + '</div></div>' +
      '<div class="yw-detail-body" id="gwDetailBody"></div>';
    if(bodyEl) document.getElementById('gwDetailBody').appendChild(bodyEl);
  }
  function hideMDetail(){
    var bodyEl = document.querySelector('#gwDetailBody .yw-body');
    if(bodyEl){
      var idx = bodyEl.getAttribute('data-idx');
      var headEl = mlistEl.querySelector('.yw-head[data-idx="'+idx+'"]');
      if(headEl) headEl.closest('.yw-item').appendChild(bodyEl);
    }
    mdetEl.style.display='none'; mdetEl.innerHTML = '';
    mlistEl.style.display='block'; window.scrollTo(0,0);
  }
  document.addEventListener('click', function(e){
    var ys = e.target.closest('[data-ysub]');
    if(ys){
      var yk = ys.getAttribute('data-ysub');
      if(yk.indexOf('g:')===0) showMList('yufa', false, yk.slice(2)); else showMList(yk.slice(2));
      return;
    }
    var card = e.target.closest('[data-mod]');
    if(card){
      var mid = card.getAttribute('data-mod');
      if(mid==='pianmu') showSections(); else showMList(mid);
      return;
    }
    /* 学段筛选：切换后按当前所在视图重渲染（知识点列表 keepFilter 保留搜索/初中优先；篇目列表按分类重渲染） */
    var lvb = e.target.closest('[data-level]');
    if(lvb){
      curLevel = lvb.getAttribute('data-level');
      if(mlistEl.style.display !== 'none' && curMod && !(curMod==='yufa' && !curGroup)) showMList(curMod, true, curGroup || undefined);
      else if(listEl.style.display !== 'none'){
        if(curListCat) showList(curListCat); else showSections();
      }
      return;
    }
    var wbs = e.target.closest('[data-gwwb-start]');
    if(wbs){
      e.stopPropagation();
      var wbox = wbs.closest('[data-gwwb]'), wname = wbox.getAttribute('data-gwwb');
      wbs.disabled = true; wbs.textContent = '加载中…';
      gwLoad(['wb/rough.js', 'wb/wb-engine.js', 'wb/terms.js', 'wb/s/' + window.NHZ_WB_INDEX[wname] + '.js'], function(ok){
        if(!ok || !window.NHZWB || !window.NHZWB.has(wname)){ wbs.disabled = false; wbs.textContent = '加载失败，点此重试'; return; }
        var pl = window.NHZWB.mount(wbox, wname); if(pl) pl.autoplay();
      });
      return;
    }
    var zd = e.target.closest('[data-zd]');
    if(zd && detEl.style.display !== 'none'){
      var ct = D.texts[curText]; detEl.querySelectorAll('.zd.on').forEach(function(x){ x.classList.remove('on'); }); zd.classList.add('on');
      var gl = document.getElementById('gwGloss'); if(gl && ct) gl.innerHTML = glossFor(ct, zd.getAttribute('data-zd'));
      return;
    }
    var pu = e.target.closest('[data-pu]');
    if(pu){ speakSen(pu.closest('.sen')); return; }
    var gp = e.target.closest('[data-gwpoint]');
    if(gp){
      var pp = gp.getAttribute('data-gwpoint').split(':');
      navPendingCross = navCrumbs(); /* 跨链接：返回回到点进来的那一页 */
      openPoint(pp[0], parseInt(pp[1], 10));
      return;
    }
    var gt = e.target.closest('[data-gwtext]');
    if(gt){
      var ti = textIdx(gt.getAttribute('data-gwtext'));
      if(ti >= 0){ navPendingCross = navCrumbs(); lastTextList = '全部'; showDetail(ti); }
      return;
    }
    var go = e.target.closest('[data-go]');
    if(go){
      var g = go.getAttribute('data-go');
      if(g==='__nav') showNav();
      else if(g==='__sections') showSections();
      else if(g==='__route') showRoute(); /* P2-B */
      else if(g==='__back'){ if(routeBack){ routeBack = false; showRoute(); } else showList(detEl.dataset.back || '全部'); } /* P2-B：只回上一层 */
      else showList(g);
      return;
    }
    var head = e.target.closest('.yw-head');
    if(head && head.hasAttribute('data-idx') && mlistEl.style.display!=='none'){
      showMDetail(head.getAttribute('data-idx'));
      return;
    }
    var mi = e.target.closest('.gw-item');
    if(mi && mi.hasAttribute('data-idx')){ showDetail(parseInt(mi.getAttribute('data-idx'), 10)); return; }
    /* 附带修（Q10 验证发现，P2-B 预留逻辑本就要求但缺处理）：路线图篇目用 data-route-idx，
       原先点之无响应，routeBack 死代码；补上后进详情，详情"回篇目"按 routeBack 只回路线图 */
    var ri = e.target.closest('[data-route-idx]');
    if(ri){ routeBack = true; showDetail(parseInt(ri.getAttribute('data-route-idx'), 10)); return; }
    /* 题库按类过滤 */
    var fb = e.target.closest('[data-bank-filter]');
    if(fb){
      var parts = fb.getAttribute('data-bank-filter').split('|');
      var fbid = parts[0];
      var fst = bankState[fbid];
      if(!fst) return;
      e.stopPropagation();
      fst.filter = parts[1];
      fst.offset = 0; fst.score = 0; fst.answered = 0;
      renderBank(fbid);
      return;
    }
    /* 题库换批 */
    var nb = e.target.closest('[data-bank-next]');
    if(nb){
      var bid = nb.getAttribute('data-bank-next');
      var st = bankState[bid];
      if(!st) return;
      e.stopPropagation();
      var flen = bankFiltered(bid).length;
      if(flen) st.offset = (st.offset+10) % flen;
      st.score = 0; st.answered = 0;
      renderBank(bid);
      return;
    }
    /* 题库答题（防重复点击） */
    var bb = e.target.closest('[data-bqid]');
    if(bb){
      var bqid = bb.getAttribute('data-bqid');
      var boi = parseInt(bb.getAttribute('data-boi'), 10);
      var bq = bankQuizData[bqid];
      var bqbox = document.getElementById(bqid);
      if(!bq || !bqbox) return;
      e.stopPropagation();
      if(bqbox.getAttribute('data-done')) return;
      bqbox.setAttribute('data-done', '1');
      var bankBox = bqbox.closest('.yw-bank');
      var bid2 = bankBox ? bankBox.id : null;
      var st2 = bid2 ? bankState[bid2] : null;
      if(st2) st2.answered++;
      var bfb = bqbox.querySelector('.quiz-fb');
      var bbtns = bqbox.querySelectorAll('[data-boi]');
      for(var b2=0; b2<bbtns.length; b2++) bbtns[b2].classList.remove('right', 'wrong');
      if(boi===bq.answer){
        bb.classList.add('right');
        if(st2) st2.score++;
        bfb.innerHTML = '✅ 答对了！' + (bq['解析'] ? esc(bq['解析']) : '');
      }else{
        bb.classList.add('wrong');
        bbtns[bq.answer].classList.add('right');
        bfb.innerHTML = '❌ 再想想。' + (bq['解析'] ? esc(bq['解析']) : '');
      }
      /* 错题打通：答错进统一错题本（答对复习项推进间隔），不改反馈与计分 */
      NHZReview.record({q:bq.q, options:bq.options, answer:bq.options[bq.answer] || '',
        解析:bq['解析'] || '', src:'古文', point:st2 ? st2.key.split(':').pop() : ''}, boi===bq.answer);
      if(bankBox && st2) bankBox.querySelector('.bank-head').textContent = bankHeadHtml(bid2);
      return;
    }
    /* 动手练 / 小测答题 */
    var qb = e.target.closest('[data-qid]');
    if(qb){
      var qid = qb.getAttribute('data-qid');
      var oi = parseInt(qb.getAttribute('data-oi'), 10);
      var q = quizData[qid];
      var qbox = document.getElementById(qid);
      if(!q || !qbox) return;
      e.stopPropagation();
      var fb2 = qbox.querySelector('.quiz-fb');
      var btns = qbox.querySelectorAll('[data-oi]');
      for(var b=0; b<btns.length; b++) btns[b].classList.remove('right', 'wrong');
      if(oi===q.answer){
        qb.classList.add('right');
        fb2.innerHTML = '✅ 答对了！' + (q['解析'] ? esc(q['解析']) : '');
      }else{
        qb.classList.add('wrong');
        btns[q.answer].classList.add('right');
        fb2.innerHTML = '❌ 再想想。' + (q['解析'] ? esc(q['解析']) : '');
      }
      /* 错题打通（动手练/小测）：只记首次作答，不改反馈与计分 */
      if(!quizRecorded[qid]){
        quizRecorded[qid] = true;
        var qbody = qbox.closest('.yw-body');
        var qrec = qbody ? currentItems[qbody.getAttribute('data-idx')] : null;
        NHZReview.record({q:q.q, options:q.options, answer:q.options[q.answer] || '',
          解析:q['解析'] || '', src:'古文', point:qrec ? qrec.it.name : ''}, oi===q.answer);
      }
      return;
    }
  });

  /* ---------- 导航：只有一个「返回」= 回上一级（负责人 2026-11-05/06：不要轻易回首页，不要内容里另放返回按钮） ----------
     每次换页记下当前视图 navView，按层级算出面包屑 navCrumbs()：[{t, go}]，最后一项是当前页。
     被首页 iframe 嵌入时把面包屑 postMessage 给首页，首页顶栏的「← 返回」调 NHZNav.up()，只有在本模块最外层才回首页；
     单独打开本页时，本页顶栏的「← 返回」同样先回上一级。跨链接（篇目↔知识点）进来的页，返回回到点进来的那一页。 */
  var navView = {k:'nav'}, navPendingCross = null;
  function navNode(v){
    var t, go;
    if(v.k==='nav') return {t:'古文', go:function(){ showNav(); }};
    if(v.k==='sec') return {t:'古文篇目', go:function(){ showSections(); }};
    if(v.k==='list') return {t: v.cat==='全部' ? '全部篇目' : v.cat, go:function(){ showList(v.cat); }};
    if(v.k==='route') return {t:'进阶路线', go:function(){ showRoute(); }};
    if(v.k==='text') return {t:(D.texts[v.idx]||{}).title || '篇目', go:function(){ routeBack = v.from==='route'; lastTextList = v.cat; showDetail(v.idx); }};
    if(v.k==='yhub') return {t:'语法', go:function(){ showMList('yufa'); }};
    if(v.k==='mlist') return {t: v.group || modMeta(v.id).t, go:function(){ showMList(v.id, false, v.group || undefined); }};
    if(v.k==='pt') return {t: v.name, go:function(){ showMList(v.base.id, false, v.base.group || undefined); if(currentItems[v.key]) showMDetail(v.key); }};
    return {t:'古文', go:function(){ showNav(); }};
  }
  function navChain(v){
    if(v.cross) return v.cross.concat([navNode(v)]);
    var c;
    switch(v.k){
      case 'nav': return [navNode(v)];
      case 'sec': return navChain({k:'nav'}).concat([navNode(v)]);
      case 'list': case 'route': return navChain({k:'sec'}).concat([navNode(v)]);
      case 'text': c = v.from==='route' ? navChain({k:'route'}) : navChain({k:'list', cat:v.cat}); return c.concat([navNode(v)]);
      case 'yhub': return navChain({k:'nav'}).concat([navNode(v)]);
      case 'mlist': c = (v.group || modMeta(v.id).parent==='yufa') ? navChain({k:'yhub'}) : navChain({k:'nav'}); return c.concat([navNode(v)]);
      case 'pt': return navChain(v.base).concat([navNode(v)]);
    }
    return navChain({k:'nav'});
  }
  function navCrumbs(){ return navChain(navView); }
  function navNotify(){
    var cr = navCrumbs(), names = cr.map(function(c){ return c.t; });
    var tt = document.getElementById('navtitle'); if(tt) tt.textContent = names.join(' › ');
    if(window.parent && window.parent !== window){
      try{ window.parent.postMessage({nhzNav:1, page:'guwen', crumbs:names}, '*'); }catch(e){}
    }
  }
  function navSet(v, crossOk){
    if(crossOk && navPendingCross){ v.cross = navPendingCross; }
    navPendingCross = crossOk ? null : navPendingCross;
    navView = v; navNotify();
  }
  window.NHZNav = {
    crumbs: function(){ return navCrumbs().map(function(c){ return c.t; }); },
    /* 回上一级；已在最外层返回 false（由调用方决定是否回首页） */
    up: function(){ var c = navCrumbs(); if(c.length < 2) return false; c[c.length-2].go(); return true; },
    go: function(i){ var c = navCrumbs(); if(i >= 0 && i < c.length - 1){ c[i].go(); return true; } return false; }
  };
  (function(){
    var oNav = showNav; showNav = function(){ navPendingCross = null; oNav.apply(this, arguments); navSet({k:'nav'}); };
    var oSec = showSections; showSections = function(){ navPendingCross = null; oSec.apply(this, arguments); navSet({k:'sec'}); };
    var oList = showList; showList = function(cat){ navPendingCross = null; oList.apply(this, arguments); navSet({k:'list', cat:cat}); };
    var oRoute = showRoute; showRoute = function(){ navPendingCross = null; oRoute.apply(this, arguments); navSet({k:'route'}); };
    var oDet = showDetail; showDetail = function(idx){
      var from = routeBack ? 'route' : 'list', cat = lastTextList || '全部';
      oDet.apply(this, arguments); navSet({k:'text', idx:idx, from:from, cat:cat}, true);
    };
    var oHub = showYufaHub; showYufaHub = function(){ navPendingCross = null; oHub.apply(this, arguments); navSet({k:'yhub'}); };
    var oML = showMList; showMList = function(id, keep, group){
      if(id==='yufa' && !group){ oML.apply(this, arguments); return; }
      oML.apply(this, arguments);
      /* openPoint 先进列表再进点详情：列表这一步不消耗跨链接来源 */
      /* 跨链接途中不通知首页，免得中间这一步把历史层级改乱 */
      if(navPendingCross) navView = {k:'mlist', id:id, group:group || null};
      else navSet({k:'mlist', id:id, group:group || null});
    };
    var oMD = showMDetail; showMDetail = function(key){
      var base = navView.k==='mlist' ? {k:'mlist', id:navView.id, group:navView.group} : {k:'mlist', id:curMod, group:curGroup};
      oMD.apply(this, arguments);
      var rec = currentItems[key];
      if(mdetEl.style.display !== 'none') navSet({k:'pt', key:key, name: rec && rec.it ? (rec.it.name || '详情') : '详情', base:base}, true);
    };
    var oHide = hideMDetail; hideMDetail = function(){ oHide.apply(this, arguments); if(navView.k==='pt') navSet(navView.base); };
  })();
  /* 单独打开本页时：顶栏「← 返回」先回上一级，最外层才回首页 */
  (function(){
    var bk = document.querySelector('.topbar .back');
    if(bk) bk.addEventListener('click', function(e){ if(window.NHZNav.up()){ e.preventDefault(); } });
  })();
  if(!K.categories || !K.categories.length){
    navEl.innerHTML = '<p class="gw-p">知识库加载失败，请确认 data/guwen_knowledge.js 存在。</p>';
  }else{
    showNav();
  }
})();
</script>
<script src="nav-up.js"></script>
</body>
