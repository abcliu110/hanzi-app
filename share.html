<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日一卡 · 识字星球</title>
<link rel="stylesheet" href="zika.css">
<link rel="manifest" href="manifest.webmanifest">
<style>
.sh-date{font-size:15px;color:var(--ink);opacity:.8;margin:16px 0 8px}
.sh-card{border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--surface);text-align:center}
.sh-type{display:inline-block;font-size:13px;font-weight:bold;background:var(--accent-soft);color:var(--accent-deep);border-radius:20px;padding:4px 14px}
.sh-char{font-size:96px;line-height:1.2;margin:8px 0}
.sh-py{font-size:17px;margin:8px 0}
.sh-mean{font-size:17px;font-weight:bold;margin:10px 0}
.sh-ex{font-size:15px;line-height:1.8;margin:6px 0}
.sh-title{font-size:28px;margin:12px 0 4px}
.sh-meta{font-size:15px;color:var(--ink);opacity:.8;margin:0 0 12px}
.sh-line{font-size:19px;line-height:2;margin:0}
.sh-note{font-size:14px;color:var(--ink);opacity:.75;line-height:1.8}
.sh-btn{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:15px;font-weight:bold;cursor:pointer}
.sh-btn.primary{background:var(--accent-soft);color:var(--accent-deep)}
.sh-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body class="page-sub">
<header class="topbar nav">
  <a href="index.html" target="_top" class="back">← 返回</a>
  <span id="navtitle">每日一卡</span>
</header>
<main class="wrap" id="app">
  <div class="loading">今日卡片生成中…</div>
</main>
<script src="data/index.js"></script>
<script src="data/shici.js"></script>
<script src="share.js"></script>
<script src="nav-up.js"></script>
</body>
</html>
